      d += 'C' + P2(p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6) + ' ' + P2(p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6) + ' ' + P2(p2[0], p2[1]);
    }
    d += 'Z';
    // små stänk runt omkring
    for (let i = 0; i < 4; i++) {
      const t = rnd() * Math.PI * 2, r = 36 + rnd() * 10, q = 2 + rnd() * 3.6;
      const x = 50 + r * Math.cos(t), y = 50 + r * Math.sin(t);
      d += `M${n(x - q)},${n(y)}a${n(q)},${n(q)} 0 1,0 ${n(2 * q)},0a${n(q)},${n(q)} 0 1,0 ${n(-2 * q)},0Z`;
    }
    return d;
  }
  const blots = {};
  A.blot = (seed = 3, color = '#1d3461') => {
    const d = blots[seed] || (blots[seed] = blotPath(seed));
    return `<svg class="blotsvg" viewBox="0 0 100 100" aria-hidden="true" focusable="false"><path d="${d}" fill="${color}"/><path d="${d}" fill="url(#pk-blotshine)" opacity=".5"/></svg>`;
  };
  A.pip = (suit, size = 16, color) => `<svg class="pipsvg" width="${size}" height="${size}" viewBox="0 0 100 100" aria-hidden="true" focusable="false" style="vertical-align:-.125em"><path d="${PIPS[suit] || PIPS[4]}" fill="${color || A.colors[suit] || STARC}"/></svg>`;
  return A;
})();

/* ---- 05-audio.js ---- */
/* ================= Ljud: kortljud, klockspel, röster och musik ================= */
// Alla effekter skapas i webbläsaren (WebAudio): kort som glider och smäller mot filten, blandning, en klocka när
// man klarar sitt bud och en dov "plump" när man inte gör det. Musiken är mp3-filer i game/music/ om de finns, och
// rösterna (Voice, längre ner) är inspelade repliker i game/voice/voice.json.
const Sound = (() => {
  const A = {};
  let ctx = null, master, sfxBus, musicBus, voiceBus, duck, noiseBuf, verbIn;
  try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) { /* stöds inte */ }

  function ensure() {
    if (ctx) { if (ctx.state === 'suspended') ctx.resume().catch(() => {}); return ctx; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    ctx = new AC();
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -12; comp.ratio.value = 3; comp.attack.value = .003; comp.release.value = .2;
    master = ctx.createGain(); master.gain.value = .9;
    master.connect(comp); comp.connect(ctx.destination);
    sfxBus = ctx.createGain(); musicBus = ctx.createGain(); voiceBus = ctx.createGain(); duck = ctx.createGain();
    sfxBus.connect(master); musicBus.connect(duck); duck.connect(master); voiceBus.connect(master);
    // lite rumsklang (ett salongsrum)
    const len = ctx.sampleRate * 1.1, ir = ctx.createBuffer(2, len, ctx.sampleRate);
    for (let ch = 0; ch < 2; ch++) { const d = ir.getChannelData(ch); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3.5); }
    const conv = ctx.createConvolver(); conv.buffer = ir;
    const wet = ctx.createGain(); wet.gain.value = .16;
    verbIn = ctx.createGain(); verbIn.connect(conv); conv.connect(wet); wet.connect(master);
    noiseBuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
    const nd = noiseBuf.getChannelData(0); for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
    A.setVolumes();
    return ctx;
  }
  A.setVolumes = () => {
    if (!ctx) return;
    sfxBus.gain.value = Settings.sfx;
    musicBus.gain.value = Settings.music * .75;
    voiceBus.gain.value = Settings.voice * 1.1;
    if (Settings.music <= 0) Tracks.stop(); else Tracks.kick();
  };
  // iPhone och iPad släpper bara fram ljud som startas av ett tryck. Anropas vid varje tryck.
  A.unlock = () => { try { ensure(); if (ctx && ctx.state !== 'running') ctx.resume().catch(() => {}); Tracks.prime(); Tracks.kick(); } catch (e) { /* ljud är valfritt */ } };

  /* ---------- Byggstenar ---------- */
  // Brus genom ett filter med en kort kurva: kortens prassel och smällar
  function noise(t, {dur = .08, f = 3000, q = 1, type = 'bandpass', gain = .5, f2 = null, attack = .002, pan = 0, verb = .3} = {}) {
    const src = ctx.createBufferSource(); src.buffer = noiseBuf;
    src.playbackRate.value = .8 + Math.random() * .4;
    const flt = ctx.createBiquadFilter(); flt.type = type; flt.frequency.setValueAtTime(f, t); flt.Q.value = q;
    if (f2) flt.frequency.exponentialRampToValueAtTime(f2, t + dur);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(gain, t + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    let node = g;
    if (pan && ctx.createStereoPanner) { const p = ctx.createStereoPanner(); p.pan.value = pan; g.connect(p); node = p; }
    src.connect(flt); flt.connect(g);
    node.connect(sfxBus);
    if (verb) { const s = ctx.createGain(); s.gain.value = verb; node.connect(s); s.connect(verbIn); }
    src.start(t, Math.random() * .5, dur + .05);
  }
  function tone(t, {f = 880, dur = .4, type = 'sine', gain = .2, attack = .005, f2 = null, verb = .5, detune = 0} = {}) {
    const o = ctx.createOscillator(); o.type = type; o.frequency.setValueAtTime(f, t); o.detune.value = detune;
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(gain, t + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(sfxBus);
    if (verb) { const s = ctx.createGain(); s.gain.value = verb; g.connect(s); s.connect(verbIn); }
    o.start(t); o.stop(t + dur + .05);
  }
  // Klocka: grundton och övertoner som klingar av
  function bell(t, f, gain = .16, dur = 1.2) {
    tone(t, {f, dur, gain, attack: .003});
    tone(t, {f: f * 2.76, dur: dur * .5, gain: gain * .35, attack: .002});
    tone(t, {f: f * 5.4, dur: dur * .25, gain: gain * .12, attack: .002});
  }
  const snap = (t, g = .5, pan = 0) => { noise(t, {dur: .05, f: 2400 + Math.random() * 900, q: .8, gain: g, pan}); noise(t, {dur: .07, f: 220, type: 'lowpass', gain: g * .5, verb: .1}); };
  const slide = (t, g = .25, dur = .12) => noise(t, {dur, f: 5200, f2: 1800, q: .6, gain: g, attack: .02});

  const SFX = {
    click: t => tone(t, {f: 1400, dur: .05, type: 'triangle', gain: .06, verb: 0}),
    tick: t => noise(t, {dur: .03, f: 4200, q: 2, gain: .18, verb: 0}),
    place: t => { slide(t, .16, .08); snap(t + .06, .46); },
    deal: t => { for (let i = 0; i < 8; i++) { slide(t + i * .09, .1, .06); snap(t + i * .09 + .05, .16, (i % 2 ? .25 : -.25)); } },
    flip: t => { noise(t, {dur: .12, f: 3000, f2: 6000, q: .7, gain: .14, attack: .01}); snap(t + .1, .38); },
    bid: t => tone(t, {f: 1046.5, dur: .22, type: 'sine', gain: .05}),
    trick: t => { bell(t, 659.25, .045, .5); },
    trickMine: t => { bell(t, 783.99, .07, .7); bell(t + .1, 1046.5, .06, .8); },
    collect: t => { noise(t, {dur: .22, f: 4200, f2: 1400, q: .5, gain: .2, attack: .03}); snap(t + .18, .3); },
    shuffle: t => { for (let i = 0; i < 26; i++) snap(t + i * .026 + Math.random() * .01, .12 + Math.random() * .1, i < 13 ? -.3 : .3); for (let i = 0; i < 6; i++) snap(t + .8 + i * .05, .2); },
    made: t => { [659.25, 783.99, 1046.5].forEach((f, i) => bell(t + i * .1, f, .1, 1.2)); },
    plump: t => { tone(t, {f: 150, f2: 70, dur: .45, type: 'sine', gain: .22, verb: .2}); noise(t, {dur: .18, f: 380, type: 'lowpass', gain: .3, verb: .2}); tone(t + .02, {f: 300, f2: 120, dur: .2, type: 'triangle', gain: .05, verb: 0}); },
    nope: t => { tone(t, {f: 180, f2: 120, dur: .18, type: 'triangle', gain: .12, verb: 0}); },
    undo: t => noise(t, {dur: .14, f: 1600, f2: 5200, q: .6, gain: .16, attack: .03}),
    hint: t => { bell(t, 987.77, .07, .7); bell(t + .1, 1318.5, .06, .7); },
    turn: t => { bell(t, 783.99, .08, .8); bell(t + .14, 1174.66, .08, 1); },
    win: t => {
      const seq = [523.25, 659.25, 783.99, 1046.5, 783.99, 1046.5, 1318.5];
      seq.forEach((f, i) => { tone(t + i * .13, {f, dur: .45, type: 'sawtooth', gain: .04}); tone(t + i * .13, {f: f / 2, dur: .5, type: 'triangle', gain: .05}); });
      for (let i = 0; i < 12; i++) bell(t + 1 + i * .06, 1500 + Math.random() * 2000, .03, .6);
    },
    count: t => tone(t, {f: 1800 + Math.random() * 400, dur: .05, type: 'triangle', gain: .05, verb: 0}),
    join: t => { bell(t, 659.25, .07, .6); bell(t + .1, 987.77, .07, .7); },
    leave: t => { bell(t, 987.77, .06, .6); bell(t + .1, 659.25, .06, .7); },
    emote: t => tone(t, {f: 1200, f2: 1600, dur: .12, gain: .05})
  };
  // Spelar en effekt (delay i ms)
  A.play = (name, delay = 0) => {
    if (!Settings.sfx) return;
    try {
      if (!ensure() || ctx.state !== 'running') return;
      const f = SFX[name];
      if (f) f(ctx.currentTime + .01 + delay / 1000);
    } catch (e) { /* ljud är valfritt */ }
  };

  /* ---------- Musik: två spelare som tonar över i varandra ---------- */
  // Låtarna (game/music/meny.mp3 och spel.mp3) spelas genom Web Audio, så att volymen och övertoningarna fungerar även
  // på iPhone och iPad (där ett ljudelements volym inte går att ändra). Nära slutet börjar låten om i den andra
  // spelaren och tonar över, så att loopen inte hörs.
  const Tracks = (() => {
    const T = {};
    const files = typeof MUSIC_FILES !== 'undefined' ? MUSIC_FILES : [];
    const variants0 = key => files.filter(f => f.replace(/\.(mp3|m4a)$/i, '').replace(/-\d+$/, '') === key);
    // (bara en låt: den spelas både i menyerna och vid bordet)
    const variants = key => variants0(key).length ? variants0(key) : variants0(key === 'meny' ? 'spel' : 'meny');
    let cur = null, wantKey = null, deck = [], active = -1, fadeT = 0;
    T.has = key => variants(key).length > 0;
    T.playing = () => !!cur;
    const urls = {};
    async function urlFor(f) {
      if (urls[f]) return urls[f];
      const src = 'music/' + f;
      try { const r = await fetch(src); if (!r.ok) throw 0; urls[f] = URL.createObjectURL(await r.blob()); }
      catch (e) { urls[f] = src; }
      return urls[f];
    }
    function makeDeck() {
      const a = new Audio(); a.preload = 'auto'; a.crossOrigin = 'anonymous';
      const d = {a, gain: null, key: null};
      try { ensure(); const srcNode = ctx.createMediaElementSource(a); d.gain = ctx.createGain(); d.gain.gain.value = 0; srcNode.connect(d.gain); d.gain.connect(musicBus); }
      catch (e) { d.gain = null; }
      a.addEventListener('timeupdate', () => { if (deck[active] === d && a.duration && a.duration - a.currentTime < 4) next(d.key); });
      a.addEventListener('error', () => { if (deck[active] === d) cur = null; });
      return d;
    }
    const level = (d, v, sec) => {
      if (d.gain && ctx) { d.gain.gain.cancelScheduledValues(ctx.currentTime); d.gain.gain.setTargetAtTime(v, ctx.currentTime, Math.max(.05, sec / 3)); }
      else { const from = d.a.volume, t0 = performance.now(); const st = () => { const k = Math.min(1, (performance.now() - t0) / (sec * 1000)); d.a.volume = clamp(from + (v * Settings.music * .75 - from) * k, 0, 1); if (k < 1) requestAnimationFrame(st); }; st(); }
    };
    let busy = false;
    async function next(key) {
      if (busy) return;
      const list = variants(key);
      if (!list.length) return;
      busy = true;
      try {
        const f = list[Math.floor(Math.random() * list.length)], url = await urlFor(f);
        if (wantKey !== key) return;
        if (!deck.length) deck = [makeDeck(), makeDeck()];
        const inc = (active + 1) % 2, out = deck[active];
        const d = deck[inc];
        d.key = key; d.a.src = url; d.a.currentTime = 0;
        try { await d.a.play(); } catch (e) { return; }
        active = inc;
        level(d, 1, 2.5);
        if (out) { level(out, 0, 2.5); clearTimeout(fadeT); fadeT = setTimeout(() => { if (deck[active] !== out) out.a.pause(); }, 3000); }
        cur = key;
      } finally { busy = false; }
    }
    T.want = key => {
      if (key === wantKey && cur === key) return;
      // samma låt för båda: spela vidare
      const same = cur && key && variants(key).join() === variants(cur).join();
      wantKey = key;
      if (same && Settings.music > 0) { cur = key; const d = deck[active]; if (d) d.key = key; return; }
      if (!key || !T.has(key) || Settings.music <= 0) { T.stop(); return; }
      next(key);
    };
    T.stop = () => { if (!cur) return; cur = null; const d = deck[active]; if (d) { level(d, 0, 1.4); setTimeout(() => { if (!cur) d.a.pause(); }, 1700); } };
    // Ett kort tyst ljud i båda spelarna vid första trycket (iPhone kräver att varje spelare startas av ett tryck en gång)
    let primed = false, priming = false, silent = null;
    function silentUrl() {
      const n = 800, b = new Uint8Array(44 + n), v = new DataView(b.buffer), w = (o, str) => [...str].forEach((c, i) => { b[o + i] = c.charCodeAt(0); });
      w(0, 'RIFF'); v.setUint32(4, 36 + n, true); w(8, 'WAVE'); w(12, 'fmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
      v.setUint32(24, 8000, true); v.setUint32(28, 8000, true); v.setUint16(32, 1, true); v.setUint16(34, 8, true); w(36, 'data'); v.setUint32(40, n, true); b.fill(128, 44);
      return URL.createObjectURL(new Blob([b], {type: 'audio/wav'}));
    }
    T.prime = () => {
      if (primed || priming || !files.length) return;
      if (!deck.length) deck = [makeDeck(), makeDeck()];
      silent = silent || silentUrl();
      priming = true;
      const list = deck.filter((d, k) => !(k === active && cur));
      Promise.all(list.map(d => { d.a.src = silent; return d.a.play().then(() => { if (d.a.src === silent) d.a.pause(); }); }))
        .then(() => { primed = true; priming = false; T.kick(); }, () => { priming = false; });
    };
    // Starta om musiken om den borde spela men har stannat (till exempel när sidan har legat i bakgrunden)
    T.kick = () => {
      const d = deck[active];
      if (cur && d && d.a.paused && d.a.src !== silent) d.a.play().catch(() => {});
      else if (wantKey && !cur && Settings.music > 0) next(wantKey);
    };
    // pausa när sidan inte syns (appen i bakgrunden) och fortsätt när den kommer tillbaka
    if (typeof document !== 'undefined') document.addEventListener('visibilitychange', () => {
      const d = deck[active];
      if (!d) return;
      if (document.hidden) d.a.pause(); else if (cur) d.a.play().catch(() => {});
    });
    return T;
  })();
  A.music = name => { try { Tracks.want(name); } catch (e) { /* ljud är valfritt */ } };
  // (för rösterna) ljudmotorn, rösternas kanal och att musiken sänks medan någon pratar
  A.ctx = () => { try { return ensure(); } catch (e) { return null; } };
  A.voiceOut = () => voiceBus;
  A.duck = (on, sec = .25) => { if (!ctx || !duck) return; duck.gain.cancelScheduledValues(ctx.currentTime); duck.gain.setTargetAtTime(on ? .45 : 1, ctx.currentTime, sec); };
  A.stopMusic = () => Tracks.stop();
  A.hasMusic = () => (typeof MUSIC_FILES !== 'undefined' ? MUSIC_FILES : []).length > 0;
  return A;
})();

/* ---- 05b-voice.js ---- */
/* ================= Rösterna: inspelade repliker (ElevenLabs) ================= */
// En berättarröst säger när det är din tur, vad som är trumf och hur det gick, och datorspelarna säger sina bud
// med egna röster. Replikerna ligger i voice/voice.json ({nyckel: mp3 som base64}), som laddas första gången en
// replik behövs. Nycklar: "n:din-tur" (berättaren), "n:num-3" (siffror), "p:Astrid:b2" / "p:Astrid:b2b" (bud,
// två varianter) och "p:Astrid:plump", "p:Astrid:klar". Finns en replik inte blir det tyst.
const Voice = (() => {
  const V = {};
  const PACK = typeof VOICE_PACK !== 'undefined' ? VOICE_PACK : null;
  let keys = null, pack = null, loading = null;
  const bufs = new Map();
  let playing = null, queue = [];
  V.has = () => !!PACK;
  V.ready = () => !!pack;
  function load() {
    if (pack || !PACK) return Promise.resolve(pack);
    if (loading) return loading;
    loading = fetch(PACK.url).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(j => { pack = j; keys = new Set(Object.keys(j).filter(k => !k.startsWith('__'))); return pack; })
      .catch(e => { console.warn('Rösterna kunde inte laddas', e); loading = null; return null; });
    return loading;
  }
  V.load = load;
  const b64 = s => { const bin = atob(s); const b = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) b[i] = bin.charCodeAt(i); return b.buffer; };
  async function buffer(key) {
    if (bufs.has(key)) return bufs.get(key);
    const ctx = Sound.ctx();
    if (!ctx || !pack || !pack[key]) return null;
    try {
      const buf = await new Promise((res, rej) => { const p = ctx.decodeAudioData(b64(pack[key]), res, rej); if (p && p.then) p.then(res, rej); });
      bufs.set(key, buf);
      return buf;
    } catch (e) { bufs.set(key, null); return null; }
  }
  // Spelar en replik. soft: hoppas över om någon redan pratar. Repliker köas annars (högst två i kön).
  async function play(key, {soft = false, delay = 0} = {}) {
    if (!PACK || !(Settings.voice > 0)) return;
    await load();
    if (!pack || !pack[key]) return;
    if (playing) { if (soft) return; if (queue.length >= 2) queue.shift(); queue.push({key, delay}); return; }
    const buf = await buffer(key);
    const ctx = Sound.ctx();
    if (!buf || !ctx || ctx.state !== 'running') return;
    const src = ctx.createBufferSource();
    src.buffer = buf;
    // varje replik har en egen nivå (så att alla röster låter lika starka)
    const g = ctx.createGain();
    g.gain.value = pack.__gain && pack.__gain[key] ? clamp(+pack.__gain[key], .2, 3) : 1;
    src.connect(g); g.connect(Sound.voiceOut());
    playing = src;
    Sound.duck(true);
    src.onended = () => {
      if (playing === src) playing = null;
      if (queue.length) { const q = queue.shift(); setTimeout(() => play(q.key, {delay: 0}), 120); }
      else Sound.duck(false, .6);
    };
    try { src.start(ctx.currentTime + .02 + delay / 1000); } catch (e) { playing = null; Sound.duck(false); }
  }
  V.stop = () => { queue = []; if (playing) { try { playing.stop(); } catch (e) { /* redan klar */ } playing = null; } Sound.duck(false); };
  const variant = base => { if (!keys) return base; const vs = [base, base + 'b', base + 'c'].filter(k => keys.has(k)); return vs.length ? pick(vs) : base; };
  // Berättaren
  V.say = (what, o = {}) => { if (!what) return; play(variant('n:' + what), o); };
  // Ett bud: datorspelarna med sin egen röst, alla andra med berättarens siffra
  V.bid = (seat, n) => {
    if (!PACK || !(Settings.voice > 0)) return;
    load().then(() => {
      if (!keys) return;
      const pk = seat && seat.kind === 'cpu' ? 'p:' + seat.name + ':b' + n : null;
      if (pk && keys.has(pk)) play(variant(pk));
      else play('n:num-' + n);
    });
  };
  // En datorspelares reaktion (klar, plump, vann)
  V.persona = (seat, what) => {
    if (!PACK || !(Settings.voice > 0) || !seat || seat.kind !== 'cpu') return;
    load().then(() => { const k = 'p:' + seat.name + ':' + what; if (keys && keys.has(k)) play(variant(k), {soft: true}); });
  };
  V.keys = () => keys ? [...keys] : [];
  return V;
})();

/* ---- 06-ui.js ---- */
/* ================= Gränssnittets byggstenar: dialoger, notiser, ikoner och figurer ================= */
const UI = (() => {
  const U = {};

  // Ikoner (enkla linjeikoner i SVG, färgen följer texten)
  const I = {
    menu: '<path d="M4 7h16M4 12h16M4 17h16"/>',
    close: '<path d="M6 6l12 12M18 6L6 18"/>',
    back: '<path d="M15 5l-7 7 7 7"/>',
    sound: '<path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 010 7M19 6a8.5 8.5 0 010 12"/>',
    mute: '<path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 9l5 6M22 9l-5 6"/>',

    globe: '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.6 2.6 3.8 5.6 3.8 9s-1.2 6.4-3.8 9c-2.6-2.6-3.8-5.6-3.8-9S9.4 5.6 12 3z"/>',

    share: '<path d="M12 3v12M7 8l5-5 5 5"/><path d="M5 12v7a2 2 0 002 2h10a2 2 0 002-2v-7"/>',
    star: '<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/>',
    crown: '<path d="M3 8l4.5 4L12 5l4.5 7L21 8l-2 11H5z"/>',

/* ---- 07-table.js ---- */
/* ================= Bordet: var korten ligger och hur de rör sig ================= */
// Varje kort vi ser (id) har ett eget element som flyttas med transform: min hand, korten i sticket och trumfkortet.
// De andras kort syns inte: när någon lägger ett kort dyker det upp vid spelarens plats och glider (och vänds) in
// i sticket. Ett färdigt stick ligger kvar en stund så att alla hinner se vem som tog det, och glider sedan till
// den som tog det. Platserna runt bordet visar namn, bud och stick (fyllda ringar = tagna stick).
const Table = (() => {
  const T = {};
  let root, cardsEl, zonesEl, seatsEl, hudEl, bubblesEl;
  let tgen = 0;       // ökar när bordet töms eller visas på nytt: en animation för ett gammalt läge avbryts
  let V = null, me = 0, spectator = false;
  let sel = null, hold = null, glowSeat = -1, dealing = false;
  const els = new Map();
  let G = null, history = [];
  let onTap = () => {}, hudHandlers = {};
  let collectWait = null;
  const MOVE = 420;
  const LIFT = .17;

  /* ---------- Hjälpare ---------- */
  const players = () => V ? V.opts.players : 4;
  // platsens position sett från mig: 0 = jag (nere), 1 = till vänster (nästa i tur) och sedan medsols
  const posOf = seat => (seat - me + players()) % players();
  const seatAt = pos => (me + pos) % players();
  T.me = () => me;
  T.view = () => V;
  T.geo = () => G;
  const nameOf = (view, seat) => seat === view.me ? 'Du' : (view.seats[seat] ? view.seats[seat].name : '');
  T.nameOf = seat => V ? nameOf(V, seat) : '';

  function safe() {
    const p = $('safeProbe');
    if (!p) return {t: 0, r: 0, b: 0, l: 0};
    const cs = getComputedStyle(p);
    return {t: parseFloat(cs.paddingTop) || 0, r: parseFloat(cs.paddingRight) || 0, b: parseFloat(cs.paddingBottom) || 0, l: parseFloat(cs.paddingLeft) || 0};
  }

  /* ---------- Geometri ---------- */
  // Tre lägen: stående (telefon, platta på högkant), liggande telefon (låg skärm: knapparna i en kolumn till höger)
  // och stor liggande skärm (platta, dator). Motspelarna sitter runt bordets övre del i tur och ordning från
  // vänster (den som spelar efter mig sitter till vänster), sticket ligger i mitten och min hand längst ner.
  function geometry() {
    const W = root.clientWidth || innerWidth, H = root.clientHeight || innerHeight;
    const sa = safe();
    const portrait = H >= W * 1.05;
    const side = !portrait && H < 560;
    const n = players(), m = n - 1;
    const big = sizeFactor();
    const g = {W, H, portrait, side, sa, n, m};
    g.ui = (portrait ? clamp(Math.min(W / 560, H / 860), 1, 1.45) : clamp(Math.min(W / 860, H / 640), 1, 1.6)) * (1 + (big - 1) * .8) * (Settings.calm ? 1.08 : 1);
    const hand = handList();
    const handW = W - sa.l - sa.r - 16 - (side ? clamp(W * .2, 150, 230) : 0);
    if (portrait) g.cw = clamp(Math.min(W / 4.7, H / 8.4), 58, 136) * big;
    else if (side) g.cw = clamp(Math.min(H / 4.9, handW / 6), 46, 96) * big;
    else g.cw = clamp(Math.min(W / 10.5, H / 6.4), 60, 146) * big;
    g.rows = handRows(hand.length, handW, g.cw);
    if (g.rows === 2 && portrait) g.cw = Math.min(g.cw, (handW - 8) / Math.ceil(hand.length / 2) * 1.02);
    g.ch = g.cw * 1.4;
    g.hudH = (portrait ? 52 : 48) * g.ui;
    const top = sa.t + g.hudH;
    g.handH = spectator ? 0 : g.ch * (g.rows === 1 ? 1 + LIFT + .04 : 1.66 + LIFT) + 6;
    g.hand = {x: sa.l + 8, y: H - sa.b - g.handH - 2, w: handW, h: g.handH};
    if (side) {
      g.barW = spectator ? 0 : clamp(W * .2, 150, 230);
      g.bar = {x: W - sa.r - g.barW - 6, y: top + 4, w: g.barW, h: H - sa.b - top - 10};
      g.tbl = {x: sa.l + 6, y: top + 2, w: g.bar.x - sa.l - 12, h: g.hand.y - top - 4};
    } else {
      g.barH = spectator ? 0 : 56 * g.ui;
      g.bar = {x: sa.l + 6, y: g.hand.y - g.barH, w: W - sa.l - sa.r - 12, h: g.barH};
      g.tbl = {x: sa.l + 6, y: top + 2, w: W - sa.l - sa.r - 12, h: g.bar.y - top - 4};
    }
    // platserna
    const t = g.tbl;
    if (portrait) {
      g.bw = Math.min(128 * g.ui, (t.w - 8) / Math.min(m, 3) - 6);
      g.bh = 92 * g.ui;
    } else if (side) {
      g.bw = Math.min(178 * g.ui, (t.w - 8) / Math.min(m, 5) - 6);
      g.bh = 50 * g.ui;
    } else { g.bw = Math.min(204 * g.ui, t.w * (m >= 5 ? .19 : m === 4 ? .22 : .3)); g.bh = 64 * g.ui; }
    g.tall = portrait;
    g.seats = [];
    const P = seatPoints(g);
    for (let pos = 1; pos < n; pos++) { const p = P[pos - 1]; g.seats[seatAt(pos)] = {x: p.x - g.bw / 2, y: p.y - g.bh / 2, w: g.bw, h: g.bh, cx: p.x, cy: p.y, pos}; }
    // sticket: mitten av den yta som blir kvar (liggande: platserna vid sidorna är inte i vägen)
    const cx = t.x + t.w / 2;
    const inWay = p => portrait || side || Math.abs(p.x - cx) < g.bw * 1.2;
    const seatBottom = Math.max(t.y, ...P.filter(inWay).map(p => p.y + g.bh / 2));
    g.seatBottom = Math.max(seatBottom, ...P.map(p => p.y + g.bh / 2).filter(() => portrait));
    const mh = Math.min(g.bh, 58 * g.ui);
    const low = t.y + t.h - (portrait ? mh + 8 : 0);
    if (side) {
      // liggande telefon: korten i en rad, så att de får plats på höjden
      g.tw = clamp(Math.min(g.cw * .95, (low - seatBottom - 30) / 1.4, (t.w - 16) / n / 1.06), 36, 110);
    } else {
      const rows = n === 2 ? 2.1 : 2.3;
      g.tw = clamp(Math.min(g.cw * (portrait ? 1.02 : .95), (low - seatBottom - 24) / 1.4 / rows, t.w / (n >= 5 ? 3.5 : 3.1)), 38, 132);
    }
    g.th = g.tw * 1.4;
    g.c = {x: cx, y: seatBottom + (low - seatBottom) / 2 + (side ? -6 : 0)};
    // mitt märke (namn, bud och stick), trumfkortet och knappen för förra sticket
    const mw = Math.min(200 * g.ui, t.w * .46);
    const bot = t.y + t.h;
    g.mine = {x: t.x + 4, y: bot - mh - 2, w: mw, h: mh};
    if (side) {
      // liggande telefon: mitt märke, trumfen och förra sticket överst i kolumnen till höger
      g.mine = {x: g.bar.x, y: g.bar.y, w: g.bar.w, h: mh};
      g.trumpW = clamp(mh / 1.4 * 1.05, 28, 56);
      g.trumpPos = {x: g.bar.x + g.trumpW * .75 + 2, y: g.bar.y + mh + 10 + g.trumpW * .7};
      g.lastBtn = {x: g.bar.x + g.bar.w, y: g.trumpPos.y};
    } else if (portrait) {
      g.trumpW = clamp(mh / 1.4 * 1.05, 30, 64);
      g.trumpPos = {x: g.mine.x + mw + 10 + g.trumpW * .75, y: bot - mh / 2 - 2};
      g.lastBtn = {x: t.x + t.w - 4, y: bot - mh / 2 - 2};
    } else {
      g.trumpW = clamp(g.tw * .72, 30, 84);
      g.trumpPos = {x: t.x + t.w - g.trumpW * .9 - 8, y: bot - g.trumpW * .7 - 10};
      g.lastBtn = {x: t.x + t.w - 8, y: g.trumpPos.y - g.trumpW * 1.3 - 18 * g.ui};
    }
    root.style.setProperty('--hudh', (g.hudH + sa.t).toFixed(1) + 'px');
    root.style.setProperty('--cw', g.cw.toFixed(1) + 'px');
    root.style.setProperty('--ch', g.ch.toFixed(1) + 'px');
    root.style.fontSize = (14 * g.ui).toFixed(2) + 'px';
    root.classList.toggle('port', portrait);
    root.classList.toggle('land', !portrait);
    root.classList.toggle('side', side);
    const bar = $('bar');
    if (bar) Object.assign(bar.style, {left: g.bar.x + 'px', top: g.bar.y + 'px', width: g.bar.w + 'px', height: g.bar.h + 'px', display: spectator ? 'none' : ''});
    document.body.style.setProperty('--toast-bottom', (side ? H - g.hand.y + 8 : H - g.bar.y + 8) + 'px');
    // notiserna vid bordet: överst i ytan för sticket (under platserna), aldrig över handen och knapparna
    document.body.style.setProperty('--toast-top', Math.round(g.seatBottom + 6) + 'px');
    // "Du tog sticket" och liknande: ovanför raden med mitt märke (stående), annars ovanför knapparna
    document.body.style.setProperty('--banner-bottom', (portrait ? H - g.mine.y + 10 : side ? H - g.hand.y + 8 : H - g.bar.y + 8) + 'px');
    return g;
  }
  // Mitten på varje motspelares plats, i tur och ordning från vänster
  function seatPoints(g) {
    const t = g.tbl, m = g.m, out = [];
    const bw = g.bw, bh = g.bh;
    const L = t.x + bw / 2 + 2, R = t.x + t.w - bw / 2 - 2, Y = t.y + bh / 2 + 2;
    if (g.side || (g.portrait && m <= 3)) {
      // en rad högst upp (de yttre lite lägre, som runt ett bord)
      for (let j = 0; j < m; j++) {
        const x = m === 1 ? t.x + t.w / 2 : L + (R - L) * j / (m - 1);
        const edge = m >= 3 && (j === 0 || j === m - 1) ? bh * .28 : 0;
        out.push({x: m === 2 ? t.x + t.w * (j ? .72 : .28) : x, y: Y + edge});
      }
      return out;
    }
    if (g.portrait) {
      // fyra eller fem: en på varje sida en bit ner, resten i en rad högst upp
      const sideY = t.y + Math.min(t.h * .36, bh * 2.3);
      const topN = m - 2;
      out.push({x: L, y: sideY, side: true});
      for (let j = 0; j < topN; j++) out.push({x: topN === 1 ? t.x + t.w / 2 : t.x + t.w * (j + .5) / topN, y: Y});
      out.push({x: R, y: sideY, side: true});
      return out;
    }
    // stor liggande skärm: runt en ellips över bordets övre del
    const cx = t.x + t.w / 2, rx = t.w / 2 - bw / 2 - 6, ry = Math.min(t.h * .56, t.h - bh);
    const cy = Y + ry;
    for (let j = 0; j < m; j++) {
      const a = Math.PI * (1 + (j + .5) / m);
      out.push({x: cx + rx * Math.cos(a), y: cy + ry * Math.sin(a) * (m === 1 ? 1 : 1), side: Math.sin(a) > -.5});
    }
    return out;
  }
  function handRows(n, w, cw) {
    if (n <= 1) return 1;
    const step = (w - cw) / (n - 1);
    return step >= cw * .4 ? 1 : 2;
  }

  /* ---------- Vad som ska visas ---------- */
  function handList() {
    if (!V || spectator || !Array.isArray(V.cards[me])) return [];
    const hand = V.cards[me].filter(id => !(hold && hold.cards.some(p => p.id === id)) && !V.trick.some(p => p.id === id));
    return Cards.sort(hand, V.trump, !!Settings.sortLow);
  }
  const trickCards = () => hold ? hold.cards : (V ? V.trick : []);
  // Var kortet från en viss plats ligger i sticket: i riktning mot spelaren (motspelarna i en båge över mitten,
  // jag under). På en låg liggande skärm ligger korten i en rad i tur och ordning (jag sist).
  function trickSpot(seat) {
    const g = G, c = g.c, n = g.n;
    const pos = posOf(seat);
    const r = ((seat * 53 + 11) % 13 - 6) * .9;
    if (g.side) {
      const order = pos === 0 ? n - 1 : pos - 1;
      const gap = Math.min(g.tw * 1.08, (g.tbl.w - 20 - g.tw) / Math.max(1, n - 1));
      return {x: c.x + (order - (n - 1) / 2) * gap, y: c.y + (pos === 0 ? g.th * .06 : 0), r: r * .5};
    }
    const ang = pos === 0 ? Math.PI / 2 : Math.PI * (1 + (pos - .5) / (n - 1));
    const ax = g.tw * (n >= 5 ? 1.36 : n === 2 ? .2 : 1.14), ay = g.th * (n === 2 ? .52 : .6);
    return {x: c.x + ax * Math.cos(ang), y: c.y + ay * Math.sin(ang), r};
  }
  T.trickSpot = seat => G ? trickSpot(seat) : {x: 0, y: 0};

  /* ---------- Placering av alla kort ---------- */
  function place() {
    const out = new Map();
    const g = G;
    const hand = handList();
    if (hand.length) {
      const legal = new Set(!spectator && V.phase === 'play' && V.turn === me && !hold ? Rules.legal(V, me) : hand);
      const rows = g.rows;
      const perRow = rows === 1 ? hand.length : Math.ceil(hand.length / 2);
      const rowsList = rows === 1 ? [hand] : [hand.slice(0, perRow), hand.slice(perRow)];
      rowsList.forEach((row, ri) => {
        const n = row.length;
        const groups = row.reduce((a, id, i) => a + (i && Cards.suit(id) !== Cards.suit(row[i - 1]) ? 1 : 0), 0);
        let gap = g.cw * .14;
        let step = n > 1 ? (g.hand.w - g.cw - groups * gap) / (n - 1) : 0;
        if (step < g.cw * .42) { gap = g.cw * .04; step = n > 1 ? (g.hand.w - g.cw - groups * gap) / (n - 1) : 0; }
        step = Math.min(step, g.cw * 1.04);
        const total = g.cw + (n - 1) * step + groups * gap;
        let x = g.hand.x + (g.hand.w - total) / 2 + g.cw / 2;
        const room = g.ch * LIFT;
        const baseY = rows === 1 ? g.hand.y + room + g.ch * .5 + 4 : g.hand.y + room + g.ch * (ri === 0 ? .5 : 1.16);
        row.forEach((id, i) => {
          if (i && Cards.suit(id) !== Cards.suit(row[i - 1])) x += gap;
          const t = n > 1 ? i / (n - 1) - .5 : 0;
          const arc = rows === 1 && step < g.cw * .9 ? 1 : 0;
          const lift = sel === id ? g.ch * LIFT : 0;
          const dim = Settings.hints && !legal.has(id);
          out.set(id, {x, y: baseY - lift + arc * (t * t) * g.ch * .12, r: arc * t * 4, s: 1, z: 500 + ri * 60 + i, up: true, zone: 'hand',
            cls: (sel === id ? ' sel' : '') + (dim ? ' dim' : '') + (!dim && legal.size < hand.length && V.turn === me ? ' ok' : '')});
          x += step;
        });
      });
    }
    // sticket
    const ts = g.tw / g.cw;
    trickCards().forEach((p, i) => {
      const sp = trickSpot(p.seat);
      const win = hold && hold.w === p.seat;
      out.set(p.id, {x: sp.x, y: sp.y, r: sp.r, s: ts * (win ? 1.06 : 1), z: 300 + i + (win ? 20 : 0), up: true, zone: 'trick', seat: p.seat, cls: win ? ' win' : ''});
    });
    // trumfkortet
    if (V.tc != null && !dealing) out.set(V.tc, {x: g.trumpPos.x, y: g.trumpPos.y, r: -8, s: g.trumpW / g.cw, z: 120, up: true, zone: 'trump'});
    return out;
  }

  /* ---------- Kortelementen ---------- */
  const faceHTML = id => typeof Art !== 'undefined' && Art.face ? Art.face(id) : `<div class="fallback ${Cards.red(id) ? 'red' : ''}"><b>${Cards.RANKS[Cards.rank(id)]}</b><i>${Cards.SUITS[Cards.suit(id)]}</i></div>`;
  const backHTML = () => typeof Art !== 'undefined' && Art.back ? Art.back(0) : `<div class="fallback back"></div>`;
  function makeCard(id) {
    const el = h('div', {class: 'card down', dataset: {id}});
    const inner = h('div', {class: 'cinner'});

  function makeBack() {
    const el = h('div', {class: 'card down anon'});

    el.append(inner);
    cardsEl.append(el);

  }
  const tf = (p, s) => `translate3d(${(p.x - G.cw / 2).toFixed(1)}px, ${(p.y - G.ch / 2).toFixed(1)}px, 0) rotate(${(p.r || 0).toFixed(2)}deg) scale(${(s ?? p.s ?? 1).toFixed(4)})`;
  function setPos(el, p, ms = MOVE, delay = 0) {
    el.style.transitionDuration = ms + 'ms';
    el.style.transitionDelay = delay + 'ms';

    el.style.zIndex = p.z || 1;
  }
  // Lägger alla kort där de ska vara. from: Map(id → startläge för nya kort), to: Map(id → dit kort som försvinner
  // tar vägen), delay: Map(id → ms)
  function settle(o = {}, ms = MOVE) {
    if (!V || !G) return;
    const from = o.from || new Map(), to = o.to || new Map(), delay = o.delay || new Map();
    const target = place();
    const speed = Time.speed();
    const dur = Math.max(0, Math.round(ms * speed));
    const created = [];
    for (const [id, p] of target) {
      if (els.has(id)) continue;
      const el = makeCard(id);
      const f = from.get(id) || Object.assign({}, p, {s: (p.s || 1) * .7, fade: true});
      el.style.transitionDuration = '0ms';
      el.style.transform = tf(f, f.s ?? p.s);
      el.classList.toggle('down', !!f.down);
      el.style.opacity = f.fade ? '0' : '';
      created.push(el);
    }
    if (created.length) void cardsEl.offsetWidth;
    for (const [id, p] of target) {
      const el = els.get(id);
      const d = Math.round((delay.get(id) || 0) * speed);
      setPos(el, p, dur, d);
      el.style.opacity = '';
      const wantDown = !p.up;
      if (el.classList.contains('down') !== wantDown) {
        if (d || dur) setTimeout(() => el.classList.toggle('down', wantDown), d + dur * .2); else el.classList.toggle('down', wantDown);
      }
      el.className = el.className.replace(/ (sel|dim|ok|win)\b/g, '');
      if (p.cls) el.className += p.cls;
      el.dataset.zone = p.zone;
      if (p.seat != null) el.dataset.seat = p.seat; else delete el.dataset.seat;
    }
    for (const [id, el] of [...els]) {
      if (target.has(id)) continue;
      els.delete(id);
      const t = to.get(id);
      if (t && dur > 0) {
        el.classList.toggle('down', !!t.down);
        const d = Math.round((delay.get(id) || 0) * speed);
        setPos(el, Object.assign({z: 950}, t, {s: t.s || .4}), dur, d);
        el.style.transition += `, opacity ${Math.round(dur * .6)}ms ease-in ${d + Math.round(dur * .4)}ms`;
        el.style.opacity = '0';
        setTimeout(() => el.remove(), dur + d + 80);
      } else el.remove();
    }
    renderZones();
    renderSeats();
    renderHud();
  }
  // Ett kort utan id (utdelningen)
  function flyBack(fromP, toP, {delay = 0, ms = 380, s0 = .5, s1 = .4} = {}) {
    const el = makeBack();
    el.style.transitionDuration = '0ms';
    el.style.transform = tf(fromP, s0);
    el.style.zIndex = 960;
    void el.offsetWidth;
    const speed = Time.speed();
    setTimeout(() => {
      el.style.transitionDuration = Math.round(ms * speed) + 'ms';

      el.style.opacity = '0.15';
      el.style.transition += `, opacity ${Math.round(ms * speed)}ms ease-in`;
    }, Math.round(delay * speed) + 16);
    setTimeout(() => el.remove(), Math.round((delay + ms) * speed) + 120);
  }

  /* ---------- Ytor, platser och HUD ---------- */
  // Buden som ringar: fyllda = tagna stick, tomma = stick som behövs, röda = för många
  function pips(bid, got) {
    const box = h('span', {class: 'pips'});

    for (let i = 0; i < n; i++) box.append(h('i', {class: i < got ? (i < bid ? 'got' : 'over') : 'need'}));
    return box;
  }
  T.pips = pips;
  // 1:a, 2:a, 3:e, 4:e …
  const ordinal = n => n + (n === 1 || n === 2 ? ':a' : ':e');
  T.ordinal = ordinal;
  // Hur det går för en spelare: 'klar' (har precis sitt bud och inget kvar att vänta på), 'plump' (för många,
  // eller för få stick kvar), '' annars
  function outlook(view, s) {
    const b = view.bids[s];

    if (got > b || b - got > left) return 'plump';
    if (got === b && (left === 0 || view.phase === 'end' || view.phase === 'over')) return 'klar';
    // (nollbud: bocken först när given är slut, annars ser det ut som klart redan från början)
    return got === b && b > 0 ? 'nu' : '';
  }
  T.outlook = s => V ? outlook(V, s) : '';
  function bidText(view, s) {

    if (b === 0) return got ? `Bjöd noll, ${Cards.tricks(got)}` : 'Bjöd noll';

  }

      zonesEl.append(h('div', {class: 'trumplabel', dataset: {tap: 'trump'}, style: st}, 'Trumf'));

    // sticket: en ram och små figurer vid korten, så att det syns vem som har lagt vad
    const tc = trickCards();
    tc.forEach(p => {
      const sp = trickSpot(p.seat), st = V.seats[p.seat];
      const r = G.seats[p.seat];
      const dx = r ? Math.sign(r.cx - sp.x) : 0, dy = r ? (r.cy < sp.y ? -1 : 1) : 1;
      const mine = posOf(p.seat) === 0 && !spectator;
      const tag = h('div', {class: 'ttag' + (hold && hold.w === p.seat ? ' win' : ''), style: {left: (sp.x + (mine ? 0 : dx * g.tw * .42)) + 'px', top: (sp.y + (mine ? g.th * .5 + 4 : dy * g.th * .5 + (dy < 0 ? -4 : 4))) + 'px', transform: `translate(-50%, ${mine || dy > 0 ? '0' : '-100%'})`}},
        h('span', {class: 'av'}, st.av || '🙂'), h('span', {class: 'tn'}, nameOf(V, p.seat)));

    });
    if (V.phase === 'play' && !tc.length && V.turn >= 0 && !hold) {

  /* ---------- Träffar ---------- */
  function tapInfo(target) {
    const el = target.closest('[data-tap], .card');

    if (el.classList.contains('card')) {
      const id = +el.dataset.id, zone = el.dataset.zone;

      if (zone === 'trump') return {kind: 'trump'};

  /* ---------- Utåt ---------- */
  T.init = o => {
    root = $('scrTable'); cardsEl = $('cards'); zonesEl = $('zones'); seatsEl = $('seats'); hudEl = $('hud');
    bubblesEl = h('div', {id: 'bubbles'});
    root.append(bubblesEl);

    if (!$('safeProbe')) document.body.append(h('div', {id: 'safeProbe'}));
    root.addEventListener('click', e => {
      if (e.target.closest('#bar, #hud, button:not([data-tap])')) { const t = e.target.closest('#hud [data-tap]'); if (t) onTap({kind: t.dataset.tap}, e); return; }

  T.setSel = (id, ms = 160) => { sel = id; if (V) settle({}, ms); };

  // Mitten av en plats (dit korten flyger)
  function seatPos(seat) {

  }

  /* ---------- Historiken: vad som har hänt i given ---------- */
  const cardTxt = id => Cards.cardName(id);
  T.history = () => history.slice();
  T.showHistory = () => {
    const box = h('div', {class: 'movelist'});
    if (!history.length) box.append(h('p', {class: 'muted'}, 'Inget har hänt i den här given än.'));
    history.slice(-14).reverse().forEach((m, i) => box.append(h('div', {class: 'mv' + (i ? '' : ' last')}, h('span', {class: 'av'}, m.av), h('span', {class: 'tx'}, m.text))));

  };
  const addHist = (view, seat, text) => { history.push({seat, av: seat >= 0 && view.seats[seat] ? view.seats[seat].av || '🙂' : '🃏', text}); if (history.length > 60) history.shift(); };

  /* ---------- Ett nytt läge med händelser: korten rör sig och effekterna spelas ---------- */
  T.apply = async (view, ev = []) => {
    // inget visat än (t.ex. en gäst som just har kommit in): visa läget direkt, utom en ny utdelning
    if ((!V || !G) && !ev.some(e => e.t === 'deal')) { T.set(view); return; }
    const prev = V;
    const my = tgen;
    for (const e of ev) {
      switch (e.t) {
        case 'deal': await doDeal(view, e); if (my !== tgen) return; break;
        case 'bid': {
          V = view; me = view.me >= 0 ? view.me : 0; spectator = view.me < 0;
          G = geometry(); settle({}, 200);
          const mine = e.seat === me && !spectator;
          addHist(view, e.seat, `${nameOf(view, e.seat)} ${mine ? 'bjöd' : 'bjuder'} ${e.n}`);
          Sound.play('bid');
          if (!mine) { T.bubble(e.seat, e.n === 0 ? 'Noll' : String(e.n), 'bid'); Voice.bid(view.seats[e.seat], e.n); }
          await wait(mine ? 200 : 650);
          if (my !== tgen) return;
          break;
        }
        case 'bids': {
          const bs = Rules.bidState(view);
          const d = bs.diff;
          const how = d > 0 ? `Överbjudet med ${Cards.tricks(d)}` : d < 0 ? `Underbjudet med ${Cards.tricks(-d)}` : 'Lika många bud som stick';
          addHist(view, -1, `Alla har bjudit: ${bs.sum} bud på ${bs.n} stick. ${how}.`);
          T.banner(`Bud ${bs.sum} av ${bs.n}`, how, 2600);
          await wait(1100);
          if (my !== tgen) return;
          break;
        }
        case 'play': {
          const mine = e.seat === me && !spectator;
          const from = new Map();
          if (!mine) { const sp = seatPos(e.seat); from.set(e.id, {x: sp.x, y: sp.y, s: .45, down: true, r: 0}); }
          V = view; me = view.me >= 0 ? view.me : 0; spectator = view.me < 0;
          // (ett stick som blir klart med det här kortet: visa det färdiga sticket)
          const done = ev.find(x => x.t === 'trick');
          if (done) hold = {cards: done.cards, w: -1};
          if (sel === e.id) sel = null;
          G = geometry();
          settle({from}, MOVE);
          Sound.play('place');
          addHist(view, e.seat, `${nameOf(view, e.seat)} lade ${cardTxt(e.id)}`);
          await wait(MOVE + 60);
          if (my !== tgen) return;
          break;
        }
        case 'trick': {
          V = view;
          hold = {cards: e.cards, w: e.seat};
          glowSeat = -1;
          G = geometry(); settle({}, 220);
          const mine = e.seat === me && !spectator;
          addHist(view, e.seat, `${nameOf(view, e.seat)} tog sticket`);
          Sound.play(mine ? 'trickMine' : 'trick');
          // en pratbubbla vid den som tog sticket (vid mitt märke om det var jag)
          T.bubble(e.seat, mine ? 'Du tog sticket!' : 'Mitt stick!', 'take');
          Bus.emit('table-hold', true);
          if (mine) Voice.say('du-tog', {soft: true});

          if (!Settings.autoTrick && !spectator) {

            collectWait = null;
