          if (my !== tgen) return;
          collectWait = null;
          // sticket glider till den som tog det
          const to = new Map(), sp = seatPos(e.seat);
          e.cards.forEach((p, i) => to.set(p.id, {x: sp.x, y: sp.y, s: .32, down: true, r: 0, z: 950 + i}));
          hold = null;
          glowSeat = e.seat;
          G = geometry();
          settle({to}, 460);
          Sound.play('collect');
          await wait(520);
          if (my !== tgen) return;
          glowSeat = -1;
          renderSeats();
          Bus.emit('table-hold', false);
          break;
        }
        case 'end': V = view; G = geometry(); settle({}, 200); break;
        case 'undo': {
          V = view; hold = null; sel = null;
          while (history.length && history[history.length - 1].seat !== me) history.pop();
          if (history.length) history.pop();
          addHist(view, me, 'Du ångrade');
          G = geometry(); settle({}, 300);
          break;
        }
      }
    }
    if (!ev.length || V !== view) {
      V = view; me = view.me >= 0 ? view.me : 0; spectator = view.me < 0;
      if (prev && prev.round !== view.round) hold = null;
      G = geometry(); settle({}, 260);
    }
  };
  async function doDeal(view, e) {
    history = [];
    hold = null; sel = null; glowSeat = -1;
    els.forEach(el => el.remove()); els.clear();
    V = view; me = view.me >= 0 ? view.me : 0; spectator = view.me < 0;
    root.classList.toggle('spectator', spectator);
    dealing = true;
    G = geometry();
    addHist(view, view.dealer, `${nameOf(view, view.dealer)} gav ${e.n === 1 ? 'ett kort' : Cards.num(e.n) + ' kort'} var`);
    const n = players();
    const src = seatPos(view.dealer);
    const center = {x: G.c.x, y: G.c.y};
    const from = new Map(), delay = new Map();
    const handIds = handList();
    const step = e.n > 6 ? 30 : 46;
    let k = 0;
    const myOrder = [];
    for (let i = 0; i < e.n; i++) for (let j = 1; j <= n; j++) {
      const s = (view.dealer + j) % n;
      if (s === me && !spectator) myOrder.push(k);
      else flyBack(k === 0 ? src : center, seatPos(s), {delay: k * step, ms: 360});
      k++;
    }
    handIds.forEach((id, i) => { from.set(id, Object.assign({}, center, {s: .5, down: true})); delay.set(id, (myOrder[i] ?? i * n) * step); });
    Sound.play('shuffle');
    settle({from, delay}, MOVE);
    setTimeout(() => Sound.play('deal'), 500 * Time.speed());
    await wait(k * step + 380);
    dealing = false;
    if (view.tc != null) {
      const f = new Map([[view.tc, Object.assign({}, center, {s: .6, down: true})]]);
      settle({from: f}, 520);
      Sound.play('flip');
      await wait(560);
      T.banner('Trumf: ' + Cards.SUIT_NAMES[view.trump], '', 1300);
      Voice.say('trumf-' + view.trump);
      await wait(700);
    } else settle({}, 200);
  }

  /* ---------- Effekter ---------- */
  let bannerT = 0;
  T.banner = (text, sub = '', ms = 1500, {low = false, small = false} = {}) => {
    const b = $('banner');
    b.innerHTML = '';
    b.classList.toggle('low', !!low);
    b.classList.toggle('smallb', !!small);
    b.append(h('div', {class: 'bn-main'}, text));
    if (sub) b.append(h('div', {class: 'bn-sub'}, sub));
    b.classList.remove('on'); void b.offsetWidth; b.classList.add('on');
    clearTimeout(bannerT);
    bannerT = setTimeout(() => b.classList.remove('on'), ms * Math.max(.6, Time.pace()));
  };
  // En pratbubbla vid en plats (buden)
  T.bubble = (seat, text, kind = '') => {
    if (!G) return;
    const mine = seat === me && !spectator;
    const r = mine ? G.mine : G.seats[seat];
    if (!r) return;
    const x = mine ? r.x + r.w / 2 : r.cx;
    // (en ny bubbla vid samma plats ersätter den gamla)
    bubblesEl.querySelectorAll(`[data-seat="${seat}"]`).forEach(x => x.remove());
    const ms = (kind === 'bid' ? 2600 : 2000) * Math.max(.6, Time.pace());
    const b = h('div', {class: 'sbubble ' + kind + (mine ? ' up' : ''), dataset: {seat}, style: {left: clamp(x, 70, G.W - 70) + 'px', top: (mine ? r.y - 8 : r.y + r.h + 6) + 'px', animationDuration: ms + 'ms'}}, text);
    bubblesEl.append(b);
    setTimeout(() => b.remove(), ms);
  };
  T.shake = id => { const el = els.get(id); if (!el) return; el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); setTimeout(() => el.classList.remove('shake'), 500); };
  return T;
})();

/* ---- 08-play.js ---- */
/* ================= Spelaren: bjuda och lägga kort ================= */
// Budet: när det är min tur visas en ruta med siffrorna. Tryck på en siffra och sedan på "Bjud" (eller två gånger
// på samma siffra). Budet som given inte får bjuda är överstruket med en förklaring.
// Korten: tryck på ett kort så lyfts det upp, tryck igen (eller på "Lägg") för att lägga det. Med inställningen
// "Lägg kortet med ett tryck" går det direkt. Kort som inte får läggas (man måste bekänna färg) är gråa.
const Play = (() => {
  const P = {};
  let V = null, me = 0, send = () => '', active = false, busy = false;
  let pick = null, note = '', undoT = 0, lastTap = {id: null, t: 0}, hintText = '', forbidFlash = 0;
  let barEl = null, panelEl = null;
  Bus.on('toast', (text, kind) => { if (V && active && kind === 'rule' && Menu.screen() === 'table') { note = text; P.renderBar(); } });
  Bus.on('table-layout', () => { if (V) { P.renderBar(); renderPanel(); } });
  Bus.on('table-hold', () => { if (V) P.renderBar(); });
  const hand = () => V ? Rules.handOf(V, me) : [];
  const myBid = () => active && V && V.phase === 'bid' && V.turn === me;
  const myPlay = () => active && V && V.phase === 'play' && V.turn === me && !Table.holding();
  const cap = s => s.charAt(0).toUpperCase() + s.slice(1);

  P.init = o => { send = o.send; barEl = $('bar'); panelEl = $('bidpanel'); };
  P.reset = () => { pick = null; busy = false; note = ''; Table.setSel(null, 0); if (panelEl) panelEl.textContent = ''; };
  P.update = (view, o = {}) => {
    if (!V || view.k !== V.k) note = '';
    V = view;
    me = view.me;
    active = me >= 0 && !o.watch;
    busy = false;
    const s = Table.sel();
    if (s != null && !hand().includes(s)) Table.setSel(null, 0);
    if (!myBid()) { pick = null; hintText = ''; }
    P.renderBar();
    renderPanel();
    coach();
  };
  const coach = () => { if (V && active && typeof Coach !== 'undefined') Coach.check(V, Table.sel()); };

  /* ---------- Tryck ---------- */
  P.onTap = t => {
    if (!V) return;
    Sound.unlock();
    switch (t.kind) {
      case 'hand': return active && tapCard(t.id);
      case 'seat': return seatInfo(t.seat);
      case 'lasttrick': return P.showLastTrick();
      case 'trump': return trumpInfo();
      case 'trick': if (Table.holding()) Table.collectNow(); return;
      case 'history': return Table.showHistory();
    }
  };
  function tapCard(id) {
    const now = performance.now();
    const again = lastTap.id === id && now - lastTap.t < 1600;
    lastTap = {id, t: now};
    if (V.phase === 'bid') { Table.setSel(Table.sel() === id ? null : id); Sound.play('tick'); return; }
    if (!myPlay()) {
      if (V.phase === 'play' && V.turn !== me) { Table.setSel(Table.sel() === id ? null : id); Sound.play('tick'); note = `Vänta på din tur. ${genitive(V.seats[V.turn].name)} tur nu.`; P.renderBar(); }
      return;
    }
    const legal = Rules.legal(V, me);
    if (!legal.includes(id)) {
      Sound.play('nope');
      Table.shake(id);
      const led = Rules.ledSuit(V);
      if (led >= 0) UI.toast(`Du måste bekänna färg. Lägg ${Cards.SUIT_NAMES[led]} ${Cards.SUITS[led]}.`, {ms: 3200, kind: 'rule'});
      return;
    }
    if (Settings.oneTap || (Table.sel() === id && again)) return playCard(id);
    if (Table.sel() === id) return playCard(id);
    Table.setSel(id);
    Sound.play('tick');
    P.renderBar();
    coach();
  }
  function playCard(id) {
    if (!go({t: 'play', id})) return;
    Table.setSel(null, 0);
  }
  function seatInfo(seat) {
    const st = V.seats[seat];
    if (!st) return;
    const b = V.bids[seat], got = V.got[seat];
    const who = seat === me ? 'Du' : st.name;
    let t = seat === me ? '' : `${st.name}${st.kind === 'cpu' ? ' (datorn, ' + (AI.LEVELS[st.level] ? AI.LEVELS[st.level].label.toLowerCase() : 'medel') + ')' : ''}: `;
    if (b == null) t += V.phase === 'bid' ? `${seat === me ? 'har' : 'har'} inte bjudit än.` : '';
    else t += `${seat === me ? 'Du bjöd' : 'bjöd'} ${b} och ${seat === me ? 'har' : 'har'} ${Cards.tricks(got)}.`;
    const ol = Table.outlook(seat);
    if (ol === 'plump') t += ` ${who} går plump i den här given.`;
    t += ` ${fmt(V.scores[seat])} poäng.`;
    if (V.dealer === seat) t += seat === me ? ' Du ger den här given.' : ' Ger den här given.';
    UI.toast(t.trim(), {ms: 3600, kind: 'info'});
  }
  function trumpInfo() {
    if (V.trump < 0) UI.toast('Den här given spelas utan trumf: högsta kortet i färgen som spelades ut tar sticket.', {ms: 4200});
    else UI.toast(`${cap(Cards.SUIT_NAMES[V.trump])} är trumf. Har du inte den färg som spelades ut kan du lägga en trumf, och den högsta trumfen tar sticket.`, {ms: 5200});
  }
  // Förra sticket, med vem som lade vad
  P.showLastTrick = () => {
    const t = V && V.lastTrick;
    if (!t) return UI.toast('Inget stick är spelat i den här given än.');
    const box = h('div', {class: 'lasttrickbox'});
    t.cards.forEach(p => box.append(h('div', {class: 'lt' + (p.seat === t.w ? ' win' : '')}, miniCard(p.id), h('span', {}, Table.nameOf(p.seat)), p.seat === t.w ? h('b', {}, 'tog sticket') : null)));
    UI.sheet({title: 'Förra sticket', cls: 'small', body: box});
  };
  function miniCard(id) {
    const el = h('span', {class: 'mcard'});
    el.innerHTML = typeof Art !== 'undefined' && Art.face ? Art.face(id) : Cards.label(id);
    return el;
  }
  P.miniCard = miniCard;

  /* ---------- Dragen ---------- */
  function go(a) {
    if (busy) return false;
    const err = Rules.check(V, me, a);
    if (err) { Sound.play('nope'); UI.toast(err, {ms: 3800}); return false; }
    busy = true;
    const res = send(a);
    if (res) { busy = false; UI.toast(res); return false; }
    P.renderBar();
    return true;
  }
  function doBid(n) {
    if (!myBid()) return;
    if (!go({t: 'bid', n})) return;
    pick = null;
    renderPanel();
  }
  function doHint() {
    const s = AI.suggest(V, me);
    if (!s) return;
    Sound.play('hint');
    if (s.a.t === 'bid') { pick = s.a.n; hintText = s.text; renderPanel(); return; }
    Table.setSel(s.a.id); P.renderBar();
    UI.toast('Tips: ' + s.text, {ms: 6500, kind: 'hint'});
  }

  /* ---------- Budrutan ---------- */
  function renderPanel() {
    if (!panelEl) return;
    const was = panelEl.innerHTML;
    const target = panelEl;
    panelEl = h('div');
    try { buildPanel(); } finally { const built = panelEl; panelEl = target; if (built.innerHTML !== was || !myBid()) { panelEl.textContent = ''; panelEl.append(...built.childNodes); } }
    panelEl.classList.toggle('on', !!myBid());
    placePanel();
  }
  function placePanel() {
    if (!myBid()) return;
    const G = Table.geo();
    if (G) {
      // stor liggande skärm: en bred och låg ruta (siffrorna på en rad), annars som ett kort
      const wide = !G.portrait && !G.side && G.W >= 900;
      const w = wide ? Math.min(G.W - 32, 780 * Math.min(1.25, G.ui)) : Math.min(G.W - 16, 460 * Math.min(1.3, G.ui));
      const bottom = G.side ? G.hand.y - 6 : G.bar.y - 6;
      panelEl.classList.toggle('wide', wide);
      Object.assign(panelEl.style, {left: (G.tbl.x + G.tbl.w / 2) + 'px', width: w + 'px', bottom: (G.H - bottom) + 'px', maxHeight: (bottom - G.sa.t - G.hudH - 8) + 'px'});
    }
  }
  function buildPanel() {
    const tbl = $('scrTable');
    if (tbl) tbl.classList.toggle('bidding', !!myBid());
    if (!myBid()) return;
    const f = Rules.forbidden(V);
    const box = h('div', {class: 'bidbox'});
    const trump = V.trump >= 0 ? h('span', {class: 'btrump', html: 'Trumf ' + Art.pip(V.trump, 20) + ' ' + Cards.SUIT_NAMES[V.trump]}) : h('span', {class: 'btrump none'}, 'Utan trumf');
    box.append(h('div', {class: 'bhead'}, h('h3', {}, 'Ditt bud'), trump),
      h('p', {class: 'bq'}, (V.dealer === me ? 'Du ger, så du bjuder sist. ' : '') + `Hur många stick tror du att du tar? Du har ${V.size === 1 ? 'ett kort' : Cards.num(V.size) + ' kort'}.`));
    if (Settings.hints && Stats.rounds < 4 && !hintText) box.append(h('p', {class: 'bhelp'}, 'Ess och kungar brukar ta stick. Tryck på en siffra och sedan på Bjud.'));
    const grid = h('div', {class: 'bidgrid' + (V.size >= 8 ? ' many' : '')});
    for (let i = 0; i <= V.size; i++) {
      const no = i === f;
      const b = h('button', {type: 'button', class: 'bidnum' + (pick === i ? ' on' : '') + (no ? ' no' : ''), 'aria-label': no ? `${i}, får inte bjudas` : `Bjud ${i}`}, String(i), no ? h('small', {}, 'får ej') : null);
      b.onclick = () => {
        Sound.unlock();
        if (no) {
          // det förbjudna budet: skaka, ett dovt ljud och förklaringen blinkar
          Sound.play('nope'); vibrate(40);
          b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake');
          forbidFlash = Date.now();
          const fe = panelEl.querySelector('.forbid');
          if (fe) { fe.classList.remove('flash'); void fe.offsetWidth; fe.classList.add('flash'); }
          return;
        }
        if (pick === i) return doBid(i);
        Sound.play('tick');
        pick = i;
        renderPanel();
      };
      grid.append(b);
    }
    box.append(grid);
    if (f >= 0) box.append(h('p', {class: 'forbid'}, h('b', {}, `Du bjuder sist och får inte bjuda ${f}.`), ` Då skulle buden bli lika många som sticken (${V.size}), och någon måste gå plump.`));
    if (hintText) box.append(h('p', {class: 'bhint', html: UI.icon('bulb') + '<span>' + esc('Tips: ' + hintText) + '</span>'}));
    // buden hittills
    const others = [];
    for (let j = 1; j <= V.opts.players; j++) {
      const s = (V.dealer + j) % V.opts.players;
      if (s === me) continue;
      if (V.bids[s] != null) others.push(`${V.seats[s].name} ${V.bids[s]}`);
    }
    const sum = Rules.bidSum(V);
    box.append(h('p', {class: 'sofar'}, others.length ? `Buden hittills: ${others.join(', ')}. Summa ${sum} av ${V.size} stick.` : 'Du bjuder först.'));
    const foot = h('div', {class: 'bidfoot'});
    if (Settings.hints) foot.append(UI.btn('Tips', doHint, {icon: 'bulb', cls: 'ghost'}));
    foot.append(UI.btn(pick == null ? 'Välj en siffra' : `Bjud ${Cards.num(pick, true)}`, () => { if (pick != null) doBid(pick); }, {icon: 'check', cls: 'gold' + (pick == null ? '' : ' glowonce'), disabled: pick == null}));
    box.append(foot);
    panelEl.append(box);
  }
  P.renderPanel = renderPanel;
  P.pick = () => pick;

  /* ---------- Knappraden ---------- */
  P.renderBar = () => {
    if (!barEl || !V) return;
    const real = barEl, was = real.innerHTML;
    barEl = h('div');
    try { buildBar(); } finally { const built = barEl; barEl = real; if (built.innerHTML !== was) { real.textContent = ''; real.append(...built.childNodes); } }
  };
  function buildBar() {
    const status = h('div', {class: 'status'});
    const btns = h('div', {class: 'btns'});
    barEl.append(status, btns);
    const B = (label, icon, fn, cls = '', dis = false) => { const b = UI.btn(label, fn, {icon, cls: 'bbtn ' + cls, disabled: dis}); btns.append(b); return b; };
    const say = (a, b = '') => { status.append(h('b', {}, a)); if (note) status.append(h('span', {class: 'note'}, note)); else if (b) status.append(h('span', {}, b)); };
    clearTimeout(undoT);
    const undoBtn = () => {
      const s = Game.session();
      if (!(s && s.canUndo && s.canUndo())) return;
      const b = B('Ångra', 'undo', () => { Sound.play('undo'); s.undo(); }, 'ghost undo');
      const u = s.undoLeft ? s.undoLeft() : null;
      if (u && u.total) {
        b.append(h('i', {class: 'timer', style: {'--from': (u.left / u.total).toFixed(3), animationDuration: Math.round(u.left) + 'ms'}}));
        undoT = setTimeout(() => P.renderBar(), u.left + 80);
      }
    };
    if (!active) { say('Du tittar på', V.phase === 'play' && V.turn >= 0 ? `${genitive(V.seats[V.turn].name)} tur` : ''); return; }
    const mine = () => {
      const b = V.bids[me], got = V.got[me];
      if (b == null) return '';
      const need = b - got, left = V.size - V.done.length;
      if (got > b) return `Du har ${Cards.tricks(got)} men bjöd ${b}. Plump den här gången.`;
      if (need > left) return `Du bjöd ${b} men kan bara få ${got + left}. Plump den här gången.`;
      if (need === 0) return b === 0 ? 'Du bjöd noll: ta inga stick.' : b === 1 ? 'Du har fått ditt stick. Ta inga fler!' : `Du har dina ${Cards.tricks(b)}. Ta inga fler!`;
      return `Du behöver ${Cards.tricks(need)} till (bjöd ${b}).`;
    };
    if (V.phase === 'end' || V.phase === 'over') {
      say(V.phase === 'over' ? 'Partiet är slut' : 'Given är slut');
      if (!Game.endOpen()) {
        B('Poängen', 'chart', () => Game.showScores(), 'ghost');
        const s = Game.session();
        if (V.phase === 'end' && s && s.canNext && s.canNext()) B('Nästa giv', 'play', () => s.next(), 'gold');
      }
      return;
    }
    if (V.phase === 'bid') {
      if (V.turn === me) { say('Din tur att bjuda', 'Välj en siffra i rutan'); return; }
      say(`${V.seats[V.turn].name} bjuder …`, V.bids[me] != null ? `Du bjöd ${V.bids[me]}.` : `Du bjuder efter ${V.turn === (me - 1 + V.opts.players) % V.opts.players ? V.seats[V.turn].name : 'de andra'}.`);
      undoBtn();
      return;
    }
    // spelet
    if (Table.holding()) { say(V.lastTrick ? (V.lastTrick.w === me ? 'Du tog sticket' : `${V.seats[V.lastTrick.w].name} tog sticket`) : 'Sticket är klart', mine()); undoBtn(); return; }
    if (V.turn !== me) {
      say(`${genitive(V.seats[V.turn].name)} tur`, mine());
      undoBtn();
      if (Table.sel() != null) B('Avmarkera', 'close', () => { Table.setSel(null); P.renderBar(); }, 'ghost');
      return;
    }
    if (busy) { say('…'); return; }
    const led = Rules.ledSuit(V);
    const legal = Rules.legal(V, me);
    const must = led >= 0 && legal.length < hand().length;
    const s = Table.sel();
    if (s != null && legal.includes(s)) say(`Lägg ${Cards.cardName(s)}?`, 'Tryck på kortet igen eller på Lägg');
    else if (!V.trick.length) say('Din tur att spela ut', mine());
    else if (must) say(`Din tur: lägg ${Cards.SUIT_NAMES[led]}`, mine());
    else if (led >= 0 && V.trump >= 0 && led !== V.trump && hand().some(id => Cards.suit(id) === V.trump)) say(`Din tur: du har ingen ${Cards.SUIT_NAMES[led]}`, 'Du får lägga vilket kort du vill, till exempel en trumf');
    else if (led >= 0) say(`Din tur: du har ingen ${Cards.SUIT_NAMES[led]}`, 'Du får lägga vilket kort du vill');
    else say('Din tur', mine());
    if (s != null && legal.includes(s)) B('Lägg', 'play', () => playCard(s), 'gold');
    if (Settings.hints) B('Tips', 'bulb', doHint, 'ghost');
  }
  return P;
})();

/* ---- 08b-coach.js ---- */
/* ================= Coachen: korta förklaringar första gången ================= */
// Första gångerna visas en liten pratbubbla som förklarar vad man trycker på. Varje förklaring visas en gång
// (sparas på enheten) och bara när "Hjälp och tips" är på. Bubblan ligger ovanför handen (aldrig över sticket eller
// platserna), tar bara emot tryck på sin knapp och försvinner av sig själv efter en stund. Budet förklaras i
// budrutan i stället (granskningen: för många bubblor ovanpå varandra i första given).
const Coach = (() => {
  const C = {};
  const seen = Object.assign({}, Store.get('coach', {}));
  let bubble = null, bubbleKey = '';
  const TIPS = {
    play: {anchor: 'hand', text: 'Din tur! Tryck på ett kort så lyfts det upp. Tryck på det igen, eller på Lägg, så spelas det.'},
    follow: {anchor: 'hand', text: 'Du måste bekänna färg, alltså lägga samma färg som spelades ut. Korten du inte får lägga är gråa.'}
  };
  let hideT = 0;
  C.off = false;   // (för automatiska tester)
  C.tip = key => {
    if (C.off || !Settings.hints || seen[key] || !TIPS[key] || bubble) return false;
    seen[key] = true;
    Store.set('coach', seen);
    show(key, TIPS[key]);
    return true;
  };
  C.done = key => { if (bubble && bubbleKey === key) hide(); };
  C.reset = () => { Object.keys(seen).forEach(k => delete seen[k]); Store.set('coach', seen); };
  function show(key, t) {
    const root = $('scrTable');
    if (!root || root.hidden) return;
    bubble = h('div', {class: 'coach', role: 'status'}, h('p', {}, t.text), h('button', {type: 'button', class: 'btn small gold', onclick: () => { Sound.play('click'); hide(); }}, 'Jag förstår'));
    bubbleKey = key;
    root.append(bubble);
    place(t.anchor);
    requestAnimationFrame(() => bubble && bubble.classList.add('on'));
    // försvinner av sig själv (många trycker aldrig på knappen)
    clearTimeout(hideT);
    const b0 = bubble;
    hideT = setTimeout(() => { if (bubble === b0) hide(); }, 14000 * Math.max(1, Time.pace()));
  }
  // Bubblan placeras vid det den handlar om, men aldrig över handen och knapparna
  function place(anchor) {
    if (!bubble) return;
    const G = Table.geo();
    if (!G) return;
    const w = Math.min(360, G.W - 24);
    bubble.style.width = w + 'px';
    const bh = bubble.offsetHeight || 120;
    const bottom = G.side ? G.hand.y - G.ch * .2 : Math.min(G.bar.y, G.hand.y - G.ch * .2);
    let x = G.tbl.x + G.tbl.w / 2, y;
    if (anchor === 'top') {
      // budrutan ligger i mitten: bubblan ovanför den
      const panel = $('bidpanel');
      const r = panel && panel.classList.contains('on') ? panel.getBoundingClientRect() : null;
      y = r ? r.top - bh - 10 : G.hudH + 20;
    } else if (anchor === 'mine') { x = G.mine.x + w / 2 + 4; y = G.mine.y - bh - 10; }
    else y = bottom - bh - 10;
    x = clamp(x, w / 2 + 12, Math.max(w / 2 + 12, G.W - w / 2 - 12));
    y = clamp(y, G.sa.t + G.hudH + 6, Math.max(G.sa.t + G.hudH + 6, bottom - bh - 8));
    Object.assign(bubble.style, {left: x + 'px', top: y + 'px'});
  }
  function hide() {
    const b = bubble;
    bubble = null; bubbleKey = '';
    if (!b) return;
    b.classList.remove('on');
    setTimeout(() => b.remove(), 250);
  }
  C.hide = hide;
  // Kallas efter varje nytt läge och varje val: vilken förklaring passar just nu?
  C.check = (V, sel = null) => {
    if (!V || V.me < 0 || !Settings.hints) return;
    const me = V.me;
    const myPlay = V.phase === 'play' && V.turn === me && !Table.holding();
    if (bubble) {
      if (!myPlay || sel != null) hide();
      else return;
    }
    if (myPlay && sel == null) {
      const legal = Rules.legal(V, me);
      // bekänna färg förklaras tidigast i andra given (en sak i taget)
      if (legal.length < Rules.handOf(V, me).length && seen.play && V.round >= 2) C.tip('follow');
      else if (!seen.play) C.tip('play');
    }
  };
  Bus.on('table-layout', () => { if (bubble) { const k = bubbleKey; place(TIPS[k] && TIPS[k].anchor); } });
  return C;
})();

/* ---- 09-mqtt.js ---- */
/* ================= Meddelanden över internet (MQTT) ================= */
// Spelarna hittar varandra och skickar dragen via öppna MQTT-servrar (publika "brokers") över krypterade
// WebSockets. Det fungerar genom alla hemnätverk och mobilnät utan egen server. För säkerhets skull ansluter
// spelet till flera servrar samtidigt och skickar allt till alla. Dubbletter känns igen och kastas.
// Litet eget MQTT 3.1.1-bibliotek: CONNECT, SUBSCRIBE, PUBLISH (QoS 0), PING och "last will" (ett bye-meddelande
// som servern skickar om anslutningen bryts oväntat).
const Mqtt = (() => {
  const M = {};
  M.BROKERS = [
    'wss://test.mosquitto.org:8081/mqtt',
    'wss://broker.emqx.io:8084/mqtt',
    'wss://broker.hivemq.com:8884/mqtt'
  ];
  M.cid = 'c' + randId(10);
  const enc = new TextEncoder(), dec = new TextDecoder();
  const u16 = n => [n >> 8 & 255, n & 255];
  const str = s => { const b = enc.encode(s); return [...u16(b.length), ...b]; };
  const remLen = n => { const out = []; do { let d = n % 128; n = Math.floor(n / 128); if (n > 0) d |= 128; out.push(d); } while (n > 0); return out; };
  const packet = (type, body) => { const b = body instanceof Uint8Array ? body : new Uint8Array(body); const h = [type, ...remLen(b.length)]; const out = new Uint8Array(h.length + b.length); out.set(h); out.set(b, h.length); return out; };

  let seq = 0, will = null;
  const subs = new Map();        // topic -> Set(handler)
  const conns = [];
  const seen = new Map();        // avsändare -> {set, list}
  const listeners = new Set();
  M.onChange = fn => { listeners.add(fn); return () => listeners.delete(fn); };
  const changed = () => listeners.forEach(fn => { try { fn(M.connected()); } catch (e) { console.error(e); } });

  class Conn {
    constructor(url) { this.url = url; this.ws = null; this.state = 'off'; this.pid = 1; this.buf = new Uint8Array(0); this.retry = 0; this.timer = 0; this.ping = 0; this.lastRx = 0; }
    open() {
      if (this.state === 'connecting' || this.state === 'on') return;
      this.state = 'connecting';
      let ws;
      try { ws = new WebSocket(this.url, ['mqtt']); } catch (e) { this.fail(); return; }
      this.ws = ws; ws.binaryType = 'arraybuffer';
      const guard = setTimeout(() => { if (this.state === 'connecting') { try { ws.close(); } catch (e) { /* stängd */ } this.fail(); } }, 9000);
      ws.onopen = () => {
        const flags = 0x02 | (will ? 0x04 : 0);
        const body = [...str('MQTT'), 4, flags, ...u16(40), ...str(M.cid + this.url.length.toString(36))];
        if (will) body.push(...str(will.topic), ...str(will.payload));
        ws.send(packet(0x10, body));
      };
      ws.onmessage = ev => { this.lastRx = Date.now(); this.read(new Uint8Array(ev.data)); };
      ws.onerror = () => {};
      ws.onclose = () => { clearTimeout(guard); if (this.ws === ws) this.fail(); };
      this.connGuard = guard;
    }
    fail() {
      const was = this.state;
      this.state = 'off'; this.ws = null;
      clearInterval(this.ping);
      if (was === 'on') changed();
      if (this.closing) return;
      const delay = [1500, 3000, 6000, 12000, 20000][Math.min(4, this.retry++)];
      clearTimeout(this.timer);
      this.timer = setTimeout(() => this.open(), delay);
    }
    read(d) {
      const nb = new Uint8Array(this.buf.length + d.length); nb.set(this.buf); nb.set(d, this.buf.length); this.buf = nb;
      for (;;) {
        if (this.buf.length < 2) return;
        let mul = 1, len = 0, i = 1, byte;
        do { if (i >= this.buf.length) return; byte = this.buf[i++]; len += (byte & 127) * mul; mul *= 128; } while (byte & 128);
        if (this.buf.length < i + len) return;
        const first = this.buf[0], type = first >> 4, qos = (first >> 1) & 3, body = this.buf.slice(i, i + len);
        this.buf = this.buf.slice(i + len);
        if (type === 2) {
          clearTimeout(this.connGuard);
          if (body[1] !== 0) { try { this.ws.close(); } catch (e) { /* stängd */ } return; }
          this.state = 'on'; this.retry = 0; this.lastRx = Date.now();
          for (const t of subs.keys()) this.sub(t);
          clearInterval(this.ping);
          this.ping = setInterval(() => {
            if (this.state !== 'on') return;
            if (Date.now() - this.lastRx > 50000) { try { this.ws.close(); } catch (e) { /* stängd */ } return; }
            this.send(new Uint8Array([0xC0, 0]));
          }, 15000);
          changed();
        } else if (type === 3) {
          const tl = (body[0] << 8) | body[1];
          const topic = dec.decode(body.subarray(2, 2 + tl));
          const payload = dec.decode(body.subarray(2 + tl + (qos ? 2 : 0)));
          deliver(topic, payload);
        }
      }
    }
    send(p) { try { if (this.ws && this.ws.readyState === 1) this.ws.send(p); } catch (e) { /* tappad */ } }
    sub(topic) { if (this.state === 'on') this.send(packet(0x82, [...u16(this.pid++ & 0xffff || 1), ...str(topic), 0])); }
    unsub(topic) { if (this.state === 'on') this.send(packet(0xA2, [...u16(this.pid++ & 0xffff || 1), ...str(topic)])); }
    pub(topic, payload) { if (this.state === 'on') this.send(packet(0x30, [...str(topic), ...enc.encode(payload)])); }
    close() { this.closing = true; clearTimeout(this.timer); clearInterval(this.ping); try { this.send(new Uint8Array([0xE0, 0])); this.ws && this.ws.close(); } catch (e) { /* stängd */ } this.state = 'off'; }
  }

  function deliver(topic, payload) {
    let msg;
    try { msg = JSON.parse(payload); } catch (e) { return; }
    if (!msg || typeof msg !== 'object' || typeof msg.f !== 'string') return;
    if (msg.f === M.cid) return;           // egna meddelanden
    // samma meddelande kommer från flera servrar: släpp bara igenom det första
    if (msg.n) {
      let s = seen.get(msg.f);
      if (!s) {
        // glöm avsändare som inte har hörts av på tio minuter (annars växer listan hela tiden i lobbyn)
        if (seen.size > 300) { const old = Date.now() - 600000; for (const [k, v] of seen) if (v.at < old) seen.delete(k); }
        s = {set: new Set(), list: []}; seen.set(msg.f, s);
      }
      s.at = Date.now();
      if (s.set.has(msg.n)) return;
      s.set.add(msg.n); s.list.push(msg.n);
      if (s.list.length > 400) s.set.delete(s.list.shift());
    }
    const hs = subs.get(topic);
    if (hs) hs.forEach(fn => { try { fn(msg, topic); } catch (e) { console.error(e); } });
  }

  M.start = () => {
    if (conns.length) { conns.forEach(c => { if (c.state === 'off') { c.retry = 0; c.open(); } }); return; }
    M.BROKERS.forEach(u => { const c = new Conn(u); conns.push(c); c.open(); });
  };
  M.setWill = (topic, obj) => { will = {topic, payload: JSON.stringify(Object.assign({f: M.cid, n: 0}, obj))}; };
  M.connected = () => conns.filter(c => c.state === 'on').length;
  M.started = () => conns.length > 0;
  // Väntar tills minst en server är ansluten
  M.ready = (ms = 10000) => new Promise(res => {
    if (M.connected()) return res(true);
    M.start();
    const off = M.onChange(n => { if (n) { off(); clearTimeout(t); res(true); } });
    const t = setTimeout(() => { off(); res(M.connected() > 0); }, ms);
  });
  M.sub = (topic, fn) => {
    let hs = subs.get(topic);
    if (!hs) { hs = new Set(); subs.set(topic, hs); conns.forEach(c => c.sub(topic)); }
    hs.add(fn);
    return () => { hs.delete(fn); if (!hs.size) { subs.delete(topic); conns.forEach(c => c.unsub(topic)); } };
  };
  M.pub = (topic, obj) => {
    const payload = JSON.stringify(Object.assign({f: M.cid, n: ++seq}, obj));
    conns.forEach(c => c.pub(topic, payload));
    return payload.length;
  };
  M.stop = () => { conns.forEach(c => c.close()); conns.length = 0; };
  // Tillbaka från bakgrunden: se till att anslutningarna lever
  if (typeof document !== 'undefined' && document.addEventListener) document.addEventListener('visibilitychange', () => { if (!document.hidden && conns.length) conns.forEach(c => { if (c.state === 'off') { c.retry = 0; clearTimeout(c.timer); c.open(); } }); });
  return M;
})();

/* ---- 10-crypto.js ---- */
/* ================= Kryptering av det hemliga (händerna) ================= */
// Meddelandena går via öppna MQTT-servrar där vem som helst kan lyssna. Därför krypteras allt som är hemligt:
// varje spelare och värden gör ett ECDH-nyckelpar (P-256) och räknar fram en gemensam AES-GCM-nyckel. Med den
// krypterar värden spelarens hand och spelaren sina drag (som då också bevisar vem de kommer ifrån).
// Webbläsare utan WebCrypto (sidor via http på det lokala nätet) skickar i klartext och markeras som osäkra.
const Crypt = (() => {
  const C = {};
  const subtle = typeof crypto !== 'undefined' && crypto.subtle;
  C.ok = !!subtle;
  const enc = new TextEncoder(), dec = new TextDecoder();
  const b64 = buf => { let s = ''; const b = new Uint8Array(buf); for (let i = 0; i < b.length; i++) s += String.fromCharCode(b[i]); return btoa(s); };
  const unb64 = s => { const bin = atob(s); const b = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) b[i] = bin.charCodeAt(i); return b; };
  C.b64 = b64; C.unb64 = unb64;

  // Ett nytt nyckelpar: {kp, pub} där pub är den publika nyckeln (base64)
  C.pair = async () => {
    if (!C.ok) return {kp: null, pub: 'plain'};
    const kp = await subtle.generateKey({name: 'ECDH', namedCurve: 'P-256'}, false, ['deriveKey']);
    const raw = await subtle.exportKey('raw', kp.publicKey);
    return {kp, pub: b64(raw)};
  };
  // Den gemensamma nyckeln med någon annans publika nyckel
  C.shared = async (mine, peerPub) => {
    if (!C.ok || !mine || !mine.kp || !peerPub || peerPub === 'plain') return null;
    const peer = await subtle.importKey('raw', unb64(peerPub), {name: 'ECDH', namedCurve: 'P-256'}, false, []);
    return subtle.deriveKey({name: 'ECDH', public: peer}, mine.kp.privateKey, {name: 'AES-GCM', length: 256}, false, ['encrypt', 'decrypt']);
  };
  // Krypterar ett objekt. aad (t.ex. bordets kod och vad det gäller) binder meddelandet till sitt sammanhang.
  C.seal = async (key, obj, aad = '') => {
    if (!key) return {pt: obj};
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = await subtle.encrypt({name: 'AES-GCM', iv, additionalData: enc.encode(aad)}, key, enc.encode(JSON.stringify(obj)));
    return {iv: b64(iv), ct: b64(ct)};
  };
  /* ---------- Värdens signatur ---------- */
  // Värden signerar allt den skickar (ECDSA P-256). Nyckeln sparas på enheten så att den är densamma efter en
  // omladdning. Gästerna litar på den nyckel som bordets första meddelande har (eller den som inbjudningslänkens
  // fingeravtryck pekar ut) och kastar allt som inte är signerat med den.
  C.signer = async () => {
    if (!C.ok) return null;
    const alg = {name: 'ECDSA', namedCurve: 'P-256'};
    const saved = Store.get('sig', null);
    if (saved && saved.priv && saved.pub) {
      try { return {priv: await subtle.importKey('jwk', saved.priv, alg, false, ['sign']), pub: saved.pub}; } catch (e) { /* gör en ny */ }
    }
    const kp = await subtle.generateKey(alg, true, ['sign', 'verify']);
    const priv = await subtle.exportKey('jwk', kp.privateKey);
    const pub = b64(await subtle.exportKey('raw', kp.publicKey));
    Store.set('sig', {priv, pub});
    return {priv: await subtle.importKey('jwk', priv, alg, false, ['sign']), pub};
  };
  C.sign = async (signer, text) => b64(await subtle.sign({name: 'ECDSA', hash: 'SHA-256'}, signer.priv, enc.encode(text)));
  C.verifier = async pub => subtle.importKey('raw', unb64(pub), {name: 'ECDSA', namedCurve: 'P-256'}, false, ['verify']);
  C.verify = async (key, text, sig) => { try { return await subtle.verify({name: 'ECDSA', hash: 'SHA-256'}, key, unb64(sig), enc.encode(text)); } catch (e) { return false; } };
  // Ett kort fingeravtryck av värdens nyckel (följer med i inbjudningslänken)
  C.fingerprint = async pub => {
    const d = new Uint8Array(await subtle.digest('SHA-256', unb64(pub)));
    return Array.from(d.slice(0, 6), b => b.toString(16).padStart(2, '0')).join('');
  };
  // Öppnar ett krypterat objekt (kastar ett fel om nyckeln är fel eller meddelandet ändrat)
  C.open = async (key, box, aad = '') => {
    if (!box) throw new Error('tomt');
    if (box.pt !== undefined) { if (key) throw new Error('okrypterat'); return box.pt; }
    if (!key) throw new Error('ingen nyckel');
    const pt = await subtle.decrypt({name: 'AES-GCM', iv: unb64(box.iv), additionalData: enc.encode(aad)}, key, unb64(box.ct));
    return JSON.parse(dec.decode(pt));
  };
  return C;
})();

/* ---- 11-net.js ---- */
/* ================= Sessioner: mot datorn, värd och gäst ================= */
// Alla sessioner har samma gränssnitt mot spelet: view() ger det spelaren får se, send(a) gör ett drag och
// 'update' (view, händelser, plats) kommer efter varje drag. Datorspelarna körs av den som har hela läget
// (mot datorn: den här enheten, online: värden). Lobbyn och borden över nätet finns längre ner.
const GAME_VER = typeof BUILD_VER !== 'undefined' ? BUILD_VER : 'dev';
const Net = (() => {
  const N = {};
  const plain = (s, n = 16) => String(s || '').replace(/[<>&"'`]/g, '').replace(/\s+/g, ' ').trim().slice(0, n);
  N.plain = plain;

  class Emitter {
    constructor() { this.ls = {}; }
    on(ev, fn) { (this.ls[ev] = this.ls[ev] || []).push(fn); return this; }
    emit(ev, ...a) { (this.ls[ev] || []).forEach(fn => { try { fn(...a); } catch (e) { console.error(e); } }); }
    off() { this.ls = {}; }
  }
  N.Emitter = Emitter;

  // Datorn gör sitt drag när det är dess tur (efter en betänketid och när bordet har visat förra draget)
  function cpuDriver(sess) {
    clearTimeout(sess.cpuT);
    const S = sess.S;
    if (!S || sess.closed) return;
    const actor = S.phase === 'bid' || S.phase === 'play' ? S.turn : -1;
    if (actor < 0 || !sess.isCpu(actor)) return;
    const base = S.phase === 'bid' ? 1100 : S.trick.length ? 850 : 1050;
    // efter människans drag väntar datorn en kort stund, så att det hinner synas (och gå att ångra)
    const hold = sess.holdUntil ? Math.max(0, sess.holdUntil - Date.now()) : 0;
    sess.cpuT = setTimeout(async () => {
      sess.cpuT = 0;
      if (sess.idle) await sess.idle();
      if (sess.closed || sess.S !== S) return;
      const seat = actor;
      const level = sess.cpuLevel(seat);
      let a = AI.act(Rules.view(S, seat), seat, level);
      try { sess.apply(seat, a); }
      catch (e) {
        console.error('Datorns drag gick inte', e, a);
        // nödutgång: första tillåtna budet eller kortet
        const V = Rules.view(S, seat);
        a = S.phase === 'bid' ? {t: 'bid', n: Rules.bidOptions(V)[0]} : {t: 'play', id: Rules.legal(V, seat)[0]};
        try { sess.apply(seat, a); } catch (e2) { console.error(e2); }
      }
    }, hold + base * Time.think() * (0.75 + Math.random() * .6));
  }
  N.cpuDriver = cpuDriver;

  /* ---------- Mot datorn (allt på den här enheten) ---------- */
  class LocalSession extends Emitter {
    constructor({players, seats, opts, restore}) {
      super();
      this.role = 'local';
      this.me = 0;
      if (restore) this.S = restore;
      else {
        this.S = Rules.create({players, seats, opts, id: randId(8), rng: cryptoRandom});
        Rules.start(this.S, cryptoRandom);
      }
      this.save();
    }
    online() { return false; }
    watching() { return false; }
    isCpu(seat) { return this.S.seats[seat].kind === 'cpu'; }
    cpuLevel(seat) { return this.S.seats[seat].level || 'medel'; }
    view() { return Rules.view(this.S, this.me); }
    apply(seat, a) {
      const r = Rules.apply(this.S, seat, a, cryptoRandom);
      const was = this.S.turn;
      this.S = r.S;
      if (this.S.turn !== was) this.turnAt = Date.now();
      this.save();
      this.emit('update', this.view(), r.ev, seat);
      cpuDriver(this);
    }
    // Mitt senaste bud eller kort går att ångra en stund (8 s i "Lugnt och tydligt", annars 5 s), tills jag gör
    // nästa drag eller given tar slut. Datorn väntar en kort stund och spelar sedan på: ångrar man tas det datorn
    // hann göra också tillbaka.
    send(a) {
      const before = this.S;
      try {
        const undoable = (a.t === 'bid' || a.t === 'play') && Settings.undo !== false;
        if (undoable) this.holdUntil = Date.now() + 900 * Time.pace();
        this.undoState = null;
        this.apply(this.me, a);
        if (undoable && (this.S.phase === 'bid' || this.S.phase === 'play')) {
          const ms = (Settings.calm ? 8000 : 5000) * Math.max(1, Time.scale);
          this.undoState = {S: before, round: this.S.round, until: Date.now() + ms, ms};
        } else { this.undoState = null; this.holdUntil = 0; }
        return '';
      } catch (e) { this.holdUntil = 0; if (e instanceof Rules.RuleError) return e.message; throw e; }
    }
    canUndo() {
      const u = this.undoState, S = this.S;
      return !!(u && Date.now() < u.until && S.round === u.round && (S.phase === 'bid' || S.phase === 'play'));
    }
    undoLeft() { const u = this.undoState; return u ? {left: Math.max(0, u.until - Date.now()), total: u.ms} : null; }
    undo() {
      if (!this.canUndo()) return false;
      clearTimeout(this.cpuT); this.cpuT = 0;
      this.S = this.undoState.S;
      this.undoState = null; this.holdUntil = 0;
      this.turnAt = Date.now();
      this.save();
      this.emit('update', this.view(), [{t: 'undo'}], this.me);
      return true;
    }
    kick() { cpuDriver(this); }
    canNext() { return true; }
    next() { if (this.S.phase === 'end') { try { this.apply(-1, {t: 'next'}); } catch (e) { console.error(e); } } }
    rematch() {
      const S = this.S;
      this.undoState = null;
      this.S = Rules.create({players: S.opts.players, seats: S.seats, opts: S.opts, id: randId(8), rng: cryptoRandom});
      Rules.start(this.S, cryptoRandom);
      this.save();
      this.emit('update', this.view(), this.S.last.ev, -1);
      cpuDriver(this);
    }
    save() {
      if (this.S.phase === 'over') Store.del('solo');
      else Store.set('solo', {S: this.S, t: Date.now()});
    }
    leave() { this.closed = true; clearTimeout(this.cpuT); }
  }
  N.LocalSession = LocalSession;
  N.savedSolo = () => { const s = Store.get('solo', null); return s && s.S && s.S.phase !== 'over' && Date.now() - s.t < 30 * 24 * 3600e3 ? s : null; };

  /* =================== Över nätet =================== */
  // Spelarna hittar varandra via öppna MQTT-servrar (se 09-mqtt.js). Den som skapar bordet är värd: värden har hela
  // läget (talongen och allas kort), gör blandningen, kontrollerar dragen och låter datorn spela på datorplatserna.
  // Efter varje drag skickar värden det alla får se och varje spelares egen hand krypterad med spelarens nyckel.
  const PRE = 'plumpklubben/v1/', T_LOBBY = PRE + 'lobby';
  // ämnet för ett bord är en kontrollsumma av koden, så att koderna inte syns för den som lyssnar på servrarna
  const tRoom = code => PRE + 'r/' + N.devHash('bord:' + code, 99);
  const ALPHA = 'ABCDEFGHJKLMNPQRSTUVWXYZ';
  N.topic = code => tRoom(N.cleanCode(code));   // (för tester)
  N.newCode = () => Array.from(crypto.getRandomValues(new Uint8Array(4)), b => ALPHA[b % ALPHA.length]).join('');
  N.cleanCode = s => String(s || '').toUpperCase().replace(/[^A-Z]/g, '').slice(0, 4);
  // Enhetens id skickas bara krypterat till värden. Ut till alla går en kontrollsumma (cyrb53) som den egna
  // telefonen känner igen sig själv på.
  N.devHash = (str, seed = 7) => {
    let h1 = 0xdeadbeef ^ seed, h2 = 0x41c6ce57 ^ seed;
    for (let i = 0; i < str.length; i++) { const ch = str.charCodeAt(i); h1 = Math.imul(h1 ^ ch, 2654435761); h2 = Math.imul(h2 ^ ch, 1597334677); }
    h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
    h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
    return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(36);
  };
  const myHash = () => N.devHash(Profile.dev);
  const hostHash = () => N.devHash(Profile.dev, 11);
  const cleanAv = a => UI.cleanAv(a);
  N.ruleText = (players, r = {}) => {
    const o = Rules.cleanOpts(players, r);
    const parts = [`${cap(Cards.num(players))} spelare`, Rules.lengthText(players, o.length) + ' kort'];
    parts.push(o.trump === 'vand' ? 'vänd upp trumf' : 'utan trumf');
    if (o.lead === 'vanster') parts.push('vänster om given spelar ut');
    if (o.zero === 10) parts.push('nollbud 10');
    if (!o.hook) parts.push('får gå jämnt ut');
    return parts.join(' · ');
  };
  const cap = t => t.charAt(0).toUpperCase() + t.slice(1);

  /* ---------- Lobbyn ---------- */
  const members = new Map();
  let inLobby = false, hiTimer = 0, sweepTimer = 0, unsubLobby = null, status = {st: 'menu', tb: null};
  const lobbyListeners = new Set();
  N.onLobby = fn => { lobbyListeners.add(fn); return () => lobbyListeners.delete(fn); };
  let lobbyT = 0;
  const lobbyChanged = () => { clearTimeout(lobbyT); lobbyT = setTimeout(() => lobbyListeners.forEach(fn => { try { fn(); } catch (e) { console.error(e); } }), 120); };
  const me = () => ({name: plain(Profile.name) || 'Spelare', av: cleanAv(Profile.avatar), st: status.st, tb: status.tb, ver: GAME_VER});
  function hi() { if (inLobby && Settings.visible !== false) Mqtt.pub(T_LOBBY, Object.assign({t: 'hi'}, me())); }
  function onLobby(msg) {
    if (msg.t === 'hi') {
      const known = members.has(msg.f);
      const tb = msg.tb && typeof msg.tb === 'object' ? {code: N.cleanCode(msg.tb.code), n: +msg.tb.n || 1, max: clamp(+msg.tb.max || 2, 2, 6), st: msg.tb.st === 'play' ? 'play' : 'wait', pub: !!msg.tb.pub, rules: plain(msg.tb.rules, 80)} : null;
      members.set(msg.f, {cid: msg.f, name: plain(msg.name) || 'Spelare', av: cleanAv(msg.av), st: String(msg.st || 'menu').slice(0, 10), tb, ver: String(msg.ver || ''), seen: Date.now()});
      if (!known) Bus.emit('lobby-join', members.get(msg.f));
      lobbyChanged();
    } else if (msg.t === 'who') { if (inLobby) setTimeout(hi, 200 + Math.random() * 900); }
    else if (msg.t === 'bye') { if (members.delete(msg.f)) lobbyChanged(); }
    else if (msg.t === 'inv' && msg.to === Mqtt.cid) Bus.emit('invite', {from: plain(msg.name) || 'Någon', av: cleanAv(msg.av), code: N.cleanCode(msg.code), cid: msg.f});
  }
  N.lobbyOn = async () => {
    if (inLobby) return true;
    Mqtt.setWill(T_LOBBY, {t: 'bye'});
    const ok = await Mqtt.ready(9000);
    if (!ok) return false;
    if (inLobby) return true;
    inLobby = true;
    unsubLobby = Mqtt.sub(T_LOBBY, onLobby);
    setTimeout(() => { Mqtt.pub(T_LOBBY, {t: 'who'}); hi(); }, 600);
    clearInterval(hiTimer); hiTimer = setInterval(hi, 20000);
    clearInterval(sweepTimer);
    sweepTimer = setInterval(() => { const now = Date.now(); let ch = false; members.forEach((m, k) => { if (now - m.seen > 50000) { members.delete(k); ch = true; } }); if (ch) lobbyChanged(); }, 5000);
    lobbyChanged();
    return true;
  };
  N.lobbyOff = () => {
    if (!inLobby) return;
    Mqtt.pub(T_LOBBY, {t: 'bye'});
    inLobby = false; clearInterval(hiTimer); clearInterval(sweepTimer); clearTimeout(lobbyT);
    if (unsubLobby) unsubLobby();
    members.clear(); lobbyChanged();
  };
  N.inLobby = () => inLobby;
  N.hi = hi;
  N.status = (st, tb = null) => { status = {st, tb}; hi(); };
  N.members = () => [...members.values()].sort((a, b) => a.name.localeCompare(b.name, 'sv'));
  N.tables = () => N.members().filter(m => m.tb && m.tb.pub && m.tb.code).map(m => Object.assign({host: m.name, av: m.av, cid: m.cid, ver: m.ver}, m.tb));
  N.invite = (cid, code) => Mqtt.pub(T_LOBBY, {t: 'inv', to: cid, code, name: plain(Profile.name), av: cleanAv(Profile.avatar)});
  N.quickTable = () => N.tables().filter(t => t.st === 'wait' && t.n < t.max && t.ver === GAME_VER).sort((a, b) => b.n - a.n)[0] || null;

  /* ---------- Värden ---------- */
  // borta efter 20 s utan livstecken. Datorn spelar åt den som är borta först när det har varit dennes tur i 45 s
  // (en telefon i fickan eller en stund i ett annat program ska inte kosta turen direkt).
  const OFFLINE_MS = 20000, AUTOPLAY_MS = 45000;
  class HostSession extends Emitter {
    constructor(o) {
      super();
      this.role = 'host';
      const saved = o.restore || null;
      this.code = saved ? saved.code : (o.code || N.newCode());
      this.topic = tRoom(this.code);
      this.opts = saved ? saved.opts : {players: o.players, rules: o.rules || {}, pub: !!o.pub};
      if (saved) this.seats = saved.seats.map(s => Object.assign({}, s, {cid: s.host ? Mqtt.cid : s.cid, online: !!s.host || s.kind !== 'human'}));
      else {
        this.seats = Array.from({length: this.opts.players}, () => ({kind: 'open'}));
        this.seats[0] = {kind: 'human', host: true, name: plain(Profile.name) || 'Värd', av: cleanAv(Profile.avatar), dev: Profile.dev, cid: Mqtt.cid, online: true};
      }
      this.state = saved ? saved.state : 'lobby';
      this.S = saved ? saved.S : null;
      this.v = saved ? saved.v + 50 : 1;
      this.keys = new Map();
      this.seen = new Map();
      this.watchers = new Map();
      this.chain = Promise.resolve();
      this.sendQ = Promise.resolve();
      this.turnAt = Date.now();
      this.ready = this.init();
    }
    async init() {
      this.kp = await Crypt.pair();
      this.signer = await Crypt.signer();
      this.fp = this.signer ? await Crypt.fingerprint(this.signer.pub) : '';
      if (this.closed) return;
      this.unsub = Mqtt.sub(this.topic, msg => { this.chain = this.chain.then(() => this.onMsg(msg)).catch(e => console.error(e)); });
      this.hb = setInterval(() => this.tick(), 2000);
      this.announce();
      if (this.S) { this.broadcast(); cpuDriver(this); }
    }
    online() { return true; }
    watching() { return false; }
    mySeat() { return this.seats.findIndex(s => s.host); }
    // datorn spelar på datorplatserna och åt spelare som har varit borta en stund
    isCpu(seat) {
      const s = this.seats[seat];
      if (!s) return false;
      if (s.kind === 'cpu') return true;
      if (s.kind !== 'human' || s.host || s.online) return false;
      if (s.left) return true;
      return Date.now() - Math.max(s.offSince || 0, this.turnAt || 0) > AUTOPLAY_MS;
    }
    cpuLevel(seat) { return this.seats[seat].level || 'medel'; }
    view() { return this.S ? Rules.view(this.S, this.mySeat()) : null; }
    info() { return {code: this.code, players: this.opts.players, rules: this.opts.rules, pub: this.opts.pub, host: this.seats[this.mySeat()] ? this.seats[this.mySeat()].name : ''}; }
    publicSeats() { return this.seats.map(s => ({kind: s.kind, name: s.name || '', av: s.av || '', level: s.level || null, online: s.kind !== 'human' || !!s.online, host: !!s.host, dh: s.dev ? N.devHash(s.dev) : null, plain: !!s.plain})); }
    roomMsg() { return {t: 'room', hd: hostHash(), v: ++this.v, ver: GAME_VER, info: this.info(), seats: this.publicSeats(), state: this.state, hk: this.kp ? this.kp.pub : null, w: this.watchers.size}; }
    // Alla meddelanden från värden går signerade och i ordning: {t: 'h', m: '<json>', s: signatur, k: värdens nyckel}
    enqueue(fn) { this.sendQ = this.sendQ.then(fn).catch(e => console.error(e)); return this.sendQ; }
    async signAndPub(inner) {
      const m = JSON.stringify(inner);
      if (!this.signer) { Mqtt.pub(this.topic, inner); return; }
      const s = await Crypt.sign(this.signer, m);
      Mqtt.pub(this.topic, {t: 'h', m, s, k: this.signer.pub});
    }
    hsend(obj) {
      if (this.closed && obj.t !== 'closed') return Promise.resolve();
      const inner = Object.assign({code: this.code, hd: hostHash()}, obj);
      return this.enqueue(() => this.signAndPub(inner));
    }
    link() { return this.code + (this.fp ? '-' + this.fp : ''); }
    // sparas i webbläsaren efter varje förändring: laddar värden om sidan (eller stänger den) går bordet att fortsätta
    save() {
      if (this.closed) return;
      Store.set('host', {code: this.code, opts: this.opts, seats: this.seats.map(s => { const o = Object.assign({}, s); delete o.cid; return o; }), state: this.state, S: this.S, v: this.v, t: Date.now()});
    }
    announce() {
      if (this.closed || !this.kp) return;
      this.hsend(this.roomMsg());
      this.save();
      const n = this.seats.filter(s => s.kind === 'human').length;
      N.status('host', {code: this.code, n, max: this.seats.filter(s => s.kind !== 'cpu').length, st: this.state === 'lobby' ? 'wait' : 'play', pub: this.opts.pub, rules: N.ruleText(this.opts.players, this.opts.rules)});
      this.emit('seats');
    }
    tick() {
      const now = Date.now();
      let ch = false;
      this.seats.forEach((s, i) => {
        if (s.kind !== 'human' || s.host) return;
        const on = now - (this.seen.get(s.cid) || 0) < OFFLINE_MS;
        if (on !== !!s.online) {
          s.online = on; ch = true;
          if (!on) s.offSince = now;
          this.emit('info', on ? `${s.name} är tillbaka.` : `${s.name} har tappat anslutningen. Datorn spelar åt ${s.name} om en stund.`);
        }
      });
      this.watchers.forEach((w, cid) => { if (now - w.seen > 20000) { this.watchers.delete(cid); ch = true; } });
      if (ch || now - (this.lastAnn || 0) > 4000) { this.lastAnn = now; this.announce(); }
      // någon som är borta och har turen: låt datorn ta över efter en stund
      if (this.S && (this.S.phase === 'bid' || this.S.phase === 'play')) {
        const actor = this.S.turn;
        if (this.isCpu(actor) && !this.cpuT) cpuDriver(this);
      }
    }
    seatOf(cid) { return this.seats.findIndex(s => s.kind === 'human' && s.cid === cid); }
    async onMsg(msg) {
      if (this.closed) return;
      if (msg.t !== 'leave') this.seen.set(msg.f, Date.now());
      const si = this.seatOf(msg.f);
      switch (msg.t) {
        case 'hello':
          if (Date.now() - (this.lastHello || 0) > 500) { this.lastHello = Date.now(); this.hsend(this.roomMsg()); }
          break;
        case 'join': return this.onJoin(msg);
        case 'hb': { const w = this.watchers.get(msg.f); if (w) w.seen = Date.now(); if (si >= 0 && !this.seats[si].online) this.tick(); break; }
        case 'act': if (si >= 0) return this.onAct(si, msg); break;
        case 'leave': {
          if (si < 0) { this.watchers.delete(msg.f); break; }
          // bara den som har platsens nyckel kan lämna den (annars kunde vem som helst skicka "leave" i någons namn)
          let ok = false;
          try { ok = !!(await Crypt.open(this.keys.get(si) || null, msg.box, this.code + ':ctl:' + si)); } catch (e) { ok = false; }
          if (!ok) break;
          const s = this.seats[si];
          if (this.state === 'lobby') { this.seats[si] = {kind: 'open'}; this.keys.delete(si); Sound.play('leave'); this.emit('info', `${s.name} gick.`); }
          else { s.online = false; s.left = true; s.offSince = Date.now(); this.seen.delete(msg.f); this.emit('info', `${s.name} lämnade bordet. Datorn tar över.`); cpuDriver(this); }
          this.announce();
          break;
        }
        case 'sit': {
          // en gäst väljer en ledig plats i väntrummet (krypterat med platsens nyckel)
          if (si < 0 || this.state !== 'lobby') break;
          let body = null;
          try { body = await Crypt.open(this.keys.get(si) || null, msg.box, this.code + ':ctl:' + si); } catch (e) { body = null; }
          const to = body && Number.isInteger(body.seat) ? body.seat : -1;
          if (this.seats[to] && this.seats[to].kind === 'open') this.swapSeats(si, to);
          break;
        }
        case 'resync': if (Date.now() - (this.lastResync || 0) > 800) { this.lastResync = Date.now(); if (this.S) this.broadcast(); else this.hsend(this.roomMsg()); } break;
        case 'emo':
          if ((si >= 0 || this.watchers.has(msg.f)) && Date.now() - (this.emoAt || 0) > 700) { this.emoAt = Date.now(); this.emit('emo', si, plain(msg.e, 40)); }
          break;
      }
    }
    async onJoin(msg) {
      if (String(msg.ver) !== GAME_VER) { this.hsend({t: 'nope', to: msg.f, why: 'ver'}); return; }
      let key = null, dev;
      try {
        key = await Crypt.shared(this.kp, msg.pk);
        const d = await Crypt.open(key, msg.sd, this.code + ':join');
        dev = plain(d && d.dev, 32);
      } catch (e) { return; }
      if (!dev) return;
      const name = plain(msg.name) || 'Spelare', av = cleanAv(msg.av);
      let i = this.seats.findIndex(s => s.kind === 'human' && s.dev === dev);
      if (i >= 0) {
        const s = this.seats[i];
        if (s.host) return;
        Object.assign(s, {cid: msg.f, online: true, plain: !key});
        if (this.state === 'lobby') Object.assign(s, {name, av});
        delete s.offSince; delete s.left;
        this.keys.set(i, key);
      } else if (this.state === 'lobby' && (i = this.seats.findIndex(s => s.kind === 'open')) >= 0) {
        this.seats[i] = {kind: 'human', name, av, dev, cid: msg.f, online: true, plain: !key};
        this.keys.set(i, key);
        Sound.play('join');
        this.emit('info', `${name} satte sig vid bordet.`);
      } else {
        this.watchers.set(msg.f, {name, seen: Date.now()});
        this.hsend({t: 'watch', to: msg.f});
      }
      this.announce();
      if (this.S) this.broadcast();
    }
    async onAct(si, msg) {
      let body;
      try { body = await Crypt.open(this.keys.get(si) || null, msg.box, this.code + ':act'); } catch (e) { return; }
      if (!body || !body.a || !this.S) return;
      // gammalt eller redan gjort (samma drag kom via flera servrar eller skickades om)
      if (body.k !== this.S.k) { if (body.k < this.S.k && Date.now() - (this.lastFix || 0) > 400) { this.lastFix = Date.now(); this.broadcast(); } return; }
      if (si !== this.S.turn) return;
      try { this.apply(si, body.a); }
      catch (e) {
        if (!(e instanceof Rules.RuleError)) { console.error(e); return; }
        this.hsend({t: 'err', to: msg.f, msg: e.message, k: this.S.k});
      }
    }
    apply(seat, a) {
      const r = Rules.apply(this.S, seat, a, cryptoRandom);
      const was = this.S.turn;
      this.S = r.S;
      if (this.S.turn !== was) this.turnAt = Date.now();
      if (this.S.phase === 'over') this.state = 'over';
      else if (this.state !== 'game') this.state = 'game';
      this.broadcast();
      this.save();
      const V = this.view();
      this.emit('update', V, V.last ? V.last.ev : [], seat);
      cpuDriver(this);
    }
    send(a) {
      try { this.apply(this.mySeat(), a); return ''; }
      catch (e) { if (e instanceof Rules.RuleError) return e.message; throw e; }
    }
    // det alla får se och varje spelares hand (krypterad). Varje läge skickas, i ordning.
    broadcast() {
      if (!this.S || this.closed) return;
      const S = this.S;
      const seats = this.seats.map((s, i) => s.kind === 'human' && !s.host && this.keys.has(i) ? {i, key: this.keys.get(i)} : null).filter(Boolean);
      this.enqueue(async () => {
        const pub = Rules.view(S, -1);
        const priv = {};
        for (const {i, key} of seats) {
          const V = Rules.view(S, i);
          priv[i] = await Crypt.seal(key, {hand: V.cards[i], ev: V.last ? V.last.ev : []}, this.code + ':st:' + i);
        }
        if (this.closed) return;
        await this.signAndPub({code: this.code, hd: hostHash(), t: 'st', v: ++this.v, k: S.k, pub, priv});
      });
    }
    // väntrummet: platser, datorer och inställningar
    setSeat(i, kind, level = 'medel') {
      if (this.state !== 'lobby' || !this.seats[i] || this.seats[i].host) return;
      const cur = this.seats[i];
      if (cur.kind === 'human') this.hsend({t: 'kick', to: cur.cid});
      if (kind === 'cpu') {
        const used = new Set(this.seats.map(s => s.name));
        const pickN = AI.NAMES.find(n => !used.has(n.name)) || AI.NAMES[0];
        this.seats[i] = {kind: 'cpu', level, name: pickN.name, av: pickN.av};
      } else this.seats[i] = {kind: 'open'};
      this.keys.delete(i);
      this.announce();
    }
    setLevel(i, level) { const s = this.seats[i]; if (s && s.kind === 'cpu' && AI.LEVELS[level]) { s.level = level; this.announce(); } }
    swapSeats(i, j) {
      if (this.state !== 'lobby' || i === j || !this.seats[i] || !this.seats[j]) return;
      [this.seats[i], this.seats[j]] = [this.seats[j], this.seats[i]];
      const ki = this.keys.get(i), kj = this.keys.get(j);
      this.keys.delete(i); this.keys.delete(j);
      if (kj !== undefined) this.keys.set(i, kj);
      if (ki !== undefined) this.keys.set(j, ki);
      this.announce();
    }
    setOpts(o) {
      if (this.state !== 'lobby') return;
      if (o.players && o.players !== this.opts.players && o.players >= Rules.MIN_PLAYERS && o.players <= Rules.MAX_PLAYERS) {
        const n = o.players;
        // behåll människorna, fyll på med lediga platser
        const humans = this.seats.filter(s => s.kind === 'human'), cpus = this.seats.filter(s => s.kind === 'cpu');
        if (humans.length > n) return this.emit('error', 'Det sitter för många vid bordet för det.');
        const next = humans.concat(cpus).slice(0, n);
        while (next.length < n) next.push({kind: 'open'});
        this.keys = new Map(next.map((s, i) => [i, s.kind === 'human' && !s.host ? this.keys.get(this.seats.indexOf(s)) : undefined]).filter(([, k]) => k !== undefined));
        this.seats = next;
        this.opts.players = n;
      }
      if (o.rules) this.opts.rules = Object.assign({}, this.opts.rules, o.rules);
      if (typeof o.pub === 'boolean') this.opts.pub = o.pub;
      this.announce();
    }
    canStart() { return this.state === 'lobby' && this.seats.every(s => s.kind === 'human' || s.kind === 'cpu'); }
    start() {
      if (!this.canStart()) return false;
      const seats = this.seats.map(s => ({name: s.name, kind: s.kind === 'cpu' ? 'cpu' : 'human', level: s.level, av: s.av}));
      this.S = Rules.create({players: this.opts.players, seats, opts: this.opts.rules, id: randId(8), rng: cryptoRandom});
      Rules.start(this.S, cryptoRandom);
      this.state = 'game';
      this.announce();
      this.broadcast();
      this.save();
      this.emit('started');
      cpuDriver(this);
      return true;
    }
    canNext() { return true; }
    next() { if (this.S && this.S.phase === 'end') { try { this.apply(-1, {t: 'next'}); } catch (e) { console.error(e); } } }
    rematch() {
      // de som har lämnat får datorn på sin plats
      this.seats.forEach(s => { if (s.kind === 'human' && !s.host && !s.online) Object.assign(s, {kind: 'cpu', level: 'medel'}); });
      this.state = 'lobby';
      this.start();
      const V = this.view();
      this.emit('update', V, V.last ? V.last.ev : [], -1);
    }
    toLobby() { this.state = 'lobby'; this.S = null; this.announce(); this.hsend({t: 'lobby'}); }
    sendEmote(e) { this.hsend({t: 'emo', e, s: this.mySeat()}); this.emit('emo', this.mySeat(), e); }
    kick() { cpuDriver(this); }
    leave() {
      if (this.closed) return;
      this.closed = true;
      Store.del('host');
      this.hsend({t: 'closed'});
      clearInterval(this.hb); clearTimeout(this.cpuT);
      if (this.unsub) this.unsub();
      N.status('menu');
      this.off();
    }
  }

  /* ---------- En gäst vid någon annans bord ---------- */
  class ClientSession extends Emitter {
    constructor(code, fp = '') {
      super();
      this.role = 'client';
      this.code = N.cleanCode(code);
      this.fp = String(fp || '').replace(/[^A-Za-z0-9_-]/g, '').slice(0, 16);
      this.sigPub = null; this.sigKey = null;
      this.topic = tRoom(this.code);
      this.V = null; this.seats = []; this.state = 'lobby'; this.info = null; this.v = 0;
      this.hostPub = null; this.hostDev = null; this.key = null; this.lastHost = Date.now(); this.hostLost = false; this.pending = null;
      this.chain = Promise.resolve();
      this.unsub = Mqtt.sub(this.topic, msg => { this.chain = this.chain.then(() => this.unwrap(msg)).catch(e => console.error(e)); });
    }

/* ================= Spelet: kopplar ihop sessionen, bordet och spelaren ================= */
// En session (mot datorn, värd eller gäst online) ger nya lägen med händelser. De spelas upp i tur och ordning

const Game = (() => {

    queue = []; running = false; lastTurnKey = ''; endShown = '';
    Menu.show('table');
    Table.clear();
    Play.reset();
    s.idle = G.idle;
    const g0 = gen;
    s.on('update', (view, ev, seat) => { if (g0 !== gen) return; queue.push({view, ev: ev || [], seat}); pump(); });
    s.on('error', msg => UI.toast(msg, {ms: 3600}));
    s.on('info', msg => UI.toast(msg, {ms: 3000}));

    if (v0) {
      V = v0;
      if (o.fresh && v0.last && v0.last.t === 'deal') { Table.set(Object.assign({}, v0, {cards: v0.cards.map(c => Array.isArray(c) ? [] : 0), tc: null}), {}); queue.push({view: v0, ev: v0.last.ev, seat: -1}); pump(); }
      else { Table.set(v0); Play.update(v0, {watch: s.watching && s.watching()}); afterUpdate(v0, [], -1); }

    gen++;
    if (session) { try { session.leave(); } catch (e) { console.error(e); } }

        if (queue.length > 4) { V = view; Table.set(view, {ms: 150}); Play.update(view, {watch: session && session.watching && session.watching()}); continue; }
        V = view;

    tbl.append(h('tr', {}, h('th', {class: 'rn'}, 'Kort'), ...order.map(s => h('th', {class: s === view.me ? 'me' : ''}, h('span', {class: 'av'}, view.seats[s].av || '🙂'), h('span', {class: 'pn'}, s === view.me ? 'Du' : view.seats[s].name)))));
    const run = view.seats.map(() => 0);
    view.opts.seq.forEach((n, ri) => {
      const hh = view.hist[ri];
      const cur = !hh && ri === view.round - 1;
      const tr = h('tr', {class: hh ? '' : cur ? 'cur' : 'todo'}, h('td', {class: 'rn'}, String(n), hh && hh.tc != null ? h('span', {class: 'tp', html: Art.pip(Cards.suit(hh.tc), 12)}) : null));
      order.forEach(s => {
        if (hh) {
          run[s] += hh.pts[s];
          const ok = hh.bids[s] === hh.got[s];
          tr.append(h('td', {class: ok ? 'ok' : 'pl'}, h('small', {class: 'bd'}, String(hh.bids[s])), ok ? h('b', {}, String(run[s])) : blot(ri * 5 + s)));
        } else if (cur && view.bids[s] != null) tr.append(h('td', {}, h('small', {class: 'bd'}, String(view.bids[s])), h('i', {class: 'dots'}, '…')));
        else tr.append(h('td', {}));
      });
      tbl.append(tr);
    });
    tbl.append(h('tr', {class: 'sum'}, h('td', {class: 'rn'}, 'Summa'), ...order.map(s => h('td', {}, h('b', {}, fmt(view.scores[s]))))));
    const note = h('p', {class: 'muted pnote'}, 'Den lilla siffran är budet. Klarar man sitt bud skrivs den nya summan, annars blir det en plump. ' +
      `Klarat bud: 10 poäng plus budet (noll bjudet och klarat: ${view.opts.zero}).`);
    UI.sheet({title: 'Protokollet', cls: 'protosheet', body: h('div', {class: 'paper'}, tbl, note)});
  };

  /* ---------- Pausmenyn ---------- */
  G.menu = () => {
    const s = session;
    const body = h('div', {class: 'pausemenu'});
    const item = (icon, label, fn, cls = '') => body.append(UI.btn(label, () => { sheet.close(); fn(); }, {icon, cls: 'wide ' + cls}));
    item('play', 'Fortsätt', () => {});
    item('chart', 'Protokollet', () => G.protocol());
    item('cards', 'Förra sticket', () => Play.showLastTrick());
    item('clock', 'Senaste händelserna', () => Table.showHistory());
    item('help', 'Så spelar man', () => Menu.rules(1));
    item('hand', 'Hur man trycker', () => Menu.rules(0));
    item('gear', 'Inställningar', () => Menu.settings());
    const online = s && s.online && s.online(), host = s && s.role === 'host';
    if (online && typeof Lobby !== 'undefined' && Lobby.emotes) item('chat', 'Säg något', () => Lobby.emotes());
    item('door', host ? 'Stäng bordet' : online ? 'Lämna bordet' : 'Avsluta partiet', async () => {
      const ok = await UI.confirm(host ? 'Stänga bordet? Partiet tar slut för alla vid bordet.' : online ? 'Lämna bordet? Datorn tar över din plats.' : 'Avsluta partiet? Du kan fortsätta det senare från menyn.', {yes: host ? 'Stäng bordet' : online ? 'Lämna' : 'Avsluta', danger: true});
      if (ok) { G.stop(); Menu.show('title'); }
    }, 'danger');
    const sheet = UI.sheet({title: 'Meny', cls: 'small', body});
  };
  return G;
})();

/* ---- 13-menu.js ---- */
/* ================= Menyerna: startskärmen, nytt parti, inställningar, statistik och regler ================= */

    const vp = document.querySelector('meta[name="viewport"]');
    if (vp) vp.setAttribute('content', 'width=device-width, initial-scale=1, viewport-fit=cover' + (name === 'table' ? ', maximum-scale=1, user-scalable=no' : ''));
    if (name === 'title') { title(); Sound.music('meny'); if (typeof Net !== 'undefined' && Net.status) Net.status('menu'); }

      const b = h('button', {type: 'button', class: 'segb', role: 'radio', dataset: {v: String(v)}}, h('span', {}, label), sub ? h('small', {}, sub) : null);
      b.onclick = () => { Sound.play('click'); set(v); onChange(v); };
      box.append(b);

    return box;

  M.toggle = (label, value, onChange, sub = '') => {

/* ---- 13b-lobby.js ---- */
/* ================= Online: lobbyn, väntrummet och inbjudningar ================= */
// Skärmarna för att spela över nätet. Själva kommunikationen finns i Net (11-net.js).
//   Online-skärmen: skapa ett bord, gå med med en kod, se öppna bord och vilka som är online.
//   Väntrummet: platserna runt bordet (människor, datorer, lediga), inställningar, länk och QR-kod att dela.
const Lobby = (() => {
  const L = {};
  let room = null;          // HostSession eller ClientSession i väntrummet
  let offLobby = null;
  const online = () => typeof Main !== 'undefined' && Main.onlineOk();
  const QR_URL = 'https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js';

  const linkFor = code => {
    const base = /^https?:/.test(location.protocol) && !/^(localhost|127\.)/.test(location.hostname) ? location.origin + location.pathname : (location.protocol === 'file:' ? SITE_URL : location.origin + location.pathname);
    return base.replace(/#.*$/, '') + '#' + code;
  };

  /* ---------- Start: länkar, pågående bord och räknaren på startskärmen ---------- */
  L.boot = () => {
    if (!online()) return;
    Bus.on('invite', inv => invited(inv));
    // länk till ett bord: …#KOD eller …#KOD-fingeravtryck (värdens nyckel, så att ingen annan kan låtsas vara värden)
    const raw = (location.hash || '').replace('#', '') || new URLSearchParams(location.search).get('bord') || '';
    const [c0, fp] = raw.split('-');
    const code = Net.cleanCode(c0);
    const saved = Net.saved();
    if (code.length === 4) { history.replaceState(null, '', location.pathname + location.search); setTimeout(() => L.joinCode(code, {fp: fp || ''}), 300); }
    else if (saved && saved.host) setTimeout(() => offerHostResume(saved.host), 400);
    else if (saved && saved.room) setTimeout(() => L.joinCode(saved.room, {quiet: true, fp: saved.fp || ''}), 400);
    // lobbyn (för "N online" på startskärmen)
    setTimeout(() => { if (Settings.visible !== false) Net.lobbyOn(); }, 2500);
    Net.onLobby(() => { L.titleCount(); if (Menu.screen() === 'online') renderOnline(); if (Menu.screen() === 'room') renderInvites(); });
  };
  L.titleCount = () => {
    const el = $('onlineCount');
    if (!el) return;
    if (!online()) { el.textContent = ''; return; }
    const n = Net.members().length, t = Net.tables().filter(x => x.st === 'wait' && x.ver === GAME_VER).length;
    el.innerHTML = Net.inLobby() && (n || t) ? `<span class="dot"></span>${n + 1} online` + (t ? ` · ${t} bord väntar på spelare` : '') : '';
  };
  L.visibility = () => { if (!online()) return; if (Settings.visible === false) Net.lobbyOff(); else Net.lobbyOn(); };

  function offerHostResume(h) {
    if (Game.active()) return;
    const body = h0('p', {class: 'lead'}, `Du har ett bord (${h.code}) med ${h.seats.filter(s => s.kind === 'human' && !s.host).map(s => s.name).join(', ') || 'datorer'} som inte är klart. Vill du fortsätta? De andra kommer tillbaka automatiskt.`);
    UI.sheet({title: 'Fortsätta bordet?', cls: 'small', body, buttons: [

  L.joinCode = async (raw, {quiet = false, fp = ''} = {}) => {

      const s = await Net.join(code, fp);
      t.remove();
      wire(s);
      if (s.state === 'lobby') showRoom(s);
      else { Game.start(s, {fresh: false}); if (s.watching()) UI.toast('Bordet är fullt. Du tittar på.', {ms: 3500}); }

        buttons: [{label: 'Till menyn', cls: 'ghost', onClick: () => { if (Menu.screen() !== 'online') Menu.show('title'); }}, {label: 'Försök igen', cls: 'gold', onClick: () => setTimeout(() => L.joinCode(code, {fp}), 50)}]});

  /* ---------- Väntrummet ---------- */
  function showRoom(s) {

  function renderRoom() {

    const head = h('div', {class: 'pagehead'}, back, h('h1', {}, h('span', {class: 'muted small'}, 'Bord '), h('span', {class: 'code'}, code)), h('span', {class: 'flex'}));

      }
      if (host && !st.host) {
        const ctl = h('div', {class: 'rctl'});

          ctl.append(UI.btn('Nivå: ' + AI.LEVELS[cur].label, () => s.setLevel(i, order[(order.indexOf(cur) + 1) % 3]), {cls: 'small'}));
        }
        ctl.append(st.kind === 'cpu' || st.kind === 'human' ? UI.btn(st.kind === 'cpu' ? 'Ta bort' : 'Flytta ut', () => s.setSeat(i, 'open'), {cls: 'small ghost'}) : UI.btn('Dator', () => s.setSeat(i, 'cpu', 'medel'), {cls: 'small', icon: 'robot'}));
        el.append(ctl);

      }

    root.append(h('div', {class: 'page'}, head, whoLine, rules, h('div', {class: 'cards2'}, h('div', {class: 'col'}, tbl, teamNote ? h('p', {class: 'roomnote'}, teamNote) : null, foot), share)));
    if (host) drawQr(url);

  // Platserna på en ellips som får plats i bordets bredd (på en smal telefon närmare mitten)
  function placeSeats(tbl, n) {
    const W = tbl.clientWidth || Math.min(innerWidth - 32, 520), H = tbl.clientHeight || 400;
    const first = tbl.querySelector('.rseat');
    const sw = first ? first.offsetWidth : 120, sh = first ? first.offsetHeight : 96;
    const rx = Math.max(0, (W / 2 - sw / 2 - 8)), ry = Math.max(0, (H / 2 - sh / 2 - 4));
    tbl.querySelectorAll('.rseat').forEach(el => {
      const a = Math.PI / 2 + (+el.dataset.pos) * 2 * Math.PI / n;

  /* ---------- Under partiet: reaktioner och anslutning ---------- */
  const EMOTES = ['👍', '😄', '😮', '😬', '🙏', '👏', '🔥', '🤔'];

    document.body.append(b);
    setTimeout(() => b.remove(), 3200);
  };
  // (för tester och skärmbilder)
  L.showRoomForTest = s => { wire(s); showRoom(s); };
  return L;
})();
