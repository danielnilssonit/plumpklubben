      <li><b>Protokollet:</b> tryck på poängen högst upp.</li>
      <li><b>Ångra:</b> mot datorn kan du ta tillbaka ditt senaste bud eller kort en stund efteråt. Listen på knappen visar hur länge.</li>
      <li><b>Tips:</b> föreslår vad datorn (svår) skulle göra, och varför.</li>
      <li><b>Lugnt och tydligt:</b> under Inställningar finns ett läge med lugnare tempo, större kort och en röst som säger när det är din tur.</li></ul>`],
    ['Spelet på en minut', () => `
      <p>Plump är ett stickspel med en vanlig kortlek. Varje giv ska alla <b>gissa hur många stick de tar</b> – och sedan
      ta precis så många. Klarar du det får du poäng. Tar du ett för mycket eller ett för lite blir det en <b>plump</b> ${blot()}
      i protokollet och inga poäng.</p>
      <ol><li><b>Utdelningen:</b> alla får lika många kort. Första given tio kort var, sedan ett kort mindre för varje giv.</li>
      <li><b>Budet:</b> alla säger i tur och ordning hur många stick de tror att de tar.</li>
      <li><b>Spelet:</b> man lägger ett kort var i turordning. Högsta kortet tar sticket. Man måste bekänna färg.</li>
      <li><b>Poängen:</b> exakt rätt antal stick ger 10 poäng plus budet.</li></ol>
      <p>Den som har flest poäng efter sista given vinner.</p>`],
    ['Budgivningen', () => `
      <p>Budgivningen börjar hos spelaren till vänster om den som ger och går medsols. Den som ger bjuder sist (märket <b>Ger</b> sitter vid figuren). Man kan bjuda från noll upp till antalet kort man har.</p>
      <p><b>Det får inte gå jämnt ut:</b> den som bjuder sist får inte bjuda så att buden tillsammans blir lika många som sticken. Då måste minst en spelare gå plump. Siffran som inte får bjudas är överstruken.</p>
      <p>Uppe i hörnet står summan av buden. Är det <b>överbjudet</b> (fler bud än stick) kommer någon att få för få stick. Är det <b>underbjudet</b> kommer någon att få för många.</p>
      <p><b>Så brukar man räkna:</b> ess tar nästan alltid ett stick ${c(k(0, 1), k(1, 1))}. En kung med ett kort till i samma färg tar ofta ett stick. Långa färger (fem kort eller fler) kan ge extra stick på slutet. Små kort tar sällan stick – de är bra när du har bjudit noll.</p>`],
    ['Spelet', () => `
      <p>Den som har bjudit <b>högst</b> spelar ut till första sticket (bjöd flera lika mycket börjar den av dem som bjöd först). Sedan lägger var och en ett kort i tur och ordning, medsols.</p>
      <p><b>Bekänn färg:</b> har du kort i den färg som spelades ut måste du lägga en av dem. Har du inte färgen får du lägga vilket kort du vill.</p>
      <p><b>Sticket</b> tas av det högsta kortet i den utspelade färgen. Esset är högst, sedan kung, dam, knekt, tio och så vidare ned till tvåan ${c(k(2, 1), k(2, 13), k(2, 12), k(2, 11), k(2, 10))}. Ett kort i en annan färg tar aldrig sticket (om ni inte spelar med trumf).</p>
      <p>Den som tar sticket spelar ut till nästa stick. När alla kort är spelade räknas poängen.</p>`],
    ['Poängen och protokollet', () => `
      <table class="ptable"><tr><td>Rätt antal stick</td><td>10 + budet</td></tr><tr><td>Till exempel: bjöd 3, tog 3</td><td>13</td></tr><tr><td>Bjöd 0 och tog inga stick</td><td>5</td></tr><tr><td>Fel antal (för många eller för få)</td><td>0 – plump</td></tr></table>
      <p>I protokollet skriver man den nya summan när man klarar sitt bud och ritar en plump ${blot()} när man inte gör det. Därav namnet! Den lilla siffran i rutan är budet.</p>
      <p>Den som har flest poäng när sista given är spelad vinner partiet.</p>`],
    ['Husregler', () => `
      <p>Plump spelas lite olika i olika familjer. Välj under <b>Husregler</b> när du startar ett parti:</p>
      <ul><li><b>Trumf:</b> utan trumf (vanligast i Sverige) eller <b>vänd upp trumf</b>: kortet efter utdelningen vänds upp och dess färg är trumf i den given. Den som inte har den utspelade färgen kan då lägga en trumf, och högsta trumfen tar sticket.</li>
      <li><b>Vem spelar ut först:</b> den som bjöd högst, eller spelaren till vänster om given.</li>
      <li><b>Nollbud:</b> 5 eller 10 poäng när man klarar det.</li>
      <li><b>Det får inte gå jämnt ut:</b> kan stängas av.</li>
      <li><b>Partiets längd:</b> kort (5 → 1), vanligt (10 → 1), långt (10 → 1 → 10) eller uppåt (1 → 10). Med sex spelare börjar man med åtta kort.</li></ul>`],
    ['Tips för att klara budet', () => `
      <ul><li><b>Har du fått dina stick?</b> Lägg höga kort när du ändå inte tar sticket (när någon annan redan har lagt ett högre), så blir du av med dem.</li>
      <li><b>Behöver du fler stick?</b> Spara dina ess och kungar och ta sticket när du är sist att lägga – då vet du att det räcker.</li>
      <li><b>Bjöd du noll?</b> Släng dina höga kort när du inte har färgen som spelas ut.</li>
      <li><b>Håll koll på andra:</b> ringarna visar vem som behöver stick och vem som inte vill ha fler. Att få ledaren att gå plump är också ett sätt att vinna!</li></ul>`]
  ];
  H.sections = () => SECTIONS.map(s => s[0]);
  H.show = (open = null) => {
    const box = h('div', {class: 'rules'});
    SECTIONS.forEach(([t, fn], i) => {
      const d = h('details', {class: 'rule'}, h('summary', {}, t), h('div', {class: 'rbody', html: fn()}));
      if (i === open || (open == null && i === 1)) d.open = true;
      box.append(d);
    });
    UI.sheet({title: 'Så spelar man', cls: 'rulesheet', body: box});
  };
  return H;
})();

/* ---- 15-main.js ---- */
/* ================= Start ================= */
const Main = (() => {
  const A = {};
  const setLoad = (p, text) => { const b = $('loadBar'); if (b) b.style.width = Math.round(p * 100) + '%'; if (text && $('loadText')) $('loadText').textContent = text; };
  // Spel över nätet fungerar inte inuti claude.ai (där stoppas anslutningarna)
  A.onlineOk = () => !ARTIFACT && !/claude\.ai|claudeusercontent|anthropic/.test(location.hostname);

  // Bordets färg, storleken och lugna animationer (klasser på body som stilarna utgår från)
  A.applyLook = () => {
    document.body.dataset.felt = Settings.felt || 'gron';
    document.body.dataset.size = Settings.size || 'normal';
    document.body.classList.toggle('calm', !!Settings.calmFx || reduceMotion);
    document.body.classList.toggle('calmui', !!Settings.calm);
  };
  // "Lugnt och tydligt" av eller på: inställningarna, kortbilderna, synligheten i lobbyn och bordet
  A.setCalm = on => {
    setCalm(on);
    A.applyLook();
    A.installArt();
    if (typeof Lobby !== 'undefined' && Lobby.visibility) Lobby.visibility();
    if (Game.active()) { Table.refresh(); Play.renderBar(); }
  };
  A.installArt = () => {
    if (typeof Art !== 'undefined' && Art.install) Art.install({fourColor: !!Settings.fourColor, wildMark: false});
    if (Game.active()) Table.refresh(0);
  };

  // Skärmen släcks inte under ett parti
  let wake = null, wakeWant = false;
  A.keepAwake = on => {
    wakeWant = !!on;
    if (!on) { if (wake) { wake.release().catch(() => {}); wake = null; } return; }
    if (wake || !navigator.wakeLock || document.hidden) return;
    navigator.wakeLock.request('screen').then(l => { wake = l; l.addEventListener('release', () => { if (wake === l) wake = null; }); if (!wakeWant) A.keepAwake(false); }).catch(() => {});
  };
  document.addEventListener('visibilitychange', () => { if (!document.hidden && wakeWant) A.keepAwake(true); });

  // Konfetti när man vinner
  A.confetti = () => {
    if (reduceMotion || Settings.calmFx) return;
    const box = h('div', {class: 'confetti'});
    const colors = ['#d6b25e', '#f1d99a', '#c0162c', '#fbf7ee', '#1d3461', '#7fb6e0'];
    for (let i = 0; i < 90; i++) {
      box.append(h('i', {style: {left: Math.random() * 100 + '%', background: colors[i % colors.length], '--dx': (Math.random() * 160 - 80) + 'px', '--r': (Math.random() * 720 - 360) + 'deg', animationDelay: (Math.random() * .9) + 's', animationDuration: (2.2 + Math.random() * 1.6) + 's', width: (6 + Math.random() * 6) + 'px', height: (8 + Math.random() * 8) + 'px'}}));
    }
    document.body.append(box);
    setTimeout(() => box.remove(), 5200);
  };

  A.boot = async () => {
    setLoad(.2, 'Blandar korten …');
    A.applyLook();
    document.body.classList.toggle('touch', isTouch);
    await sleep(30);
    try { A.installArt(); } catch (e) { console.error(e); }
    setLoad(.6, 'Dukar bordet …');
    Table.init({onTap: t => Play.onTap(t), hud: {menu: () => Game.menu(), scores: () => Game.protocol(), extra: () => typeof Lobby !== 'undefined' && Lobby.hudExtra ? Lobby.hudExtra() : []}});
    Play.init({send: a => { const s = Game.session(); return s ? s.send(a) : 'Inget parti.'; }});
    const unlock = () => Sound.unlock();
    ['pointerdown', 'touchend', 'keydown', 'click'].forEach(ev => document.addEventListener(ev, unlock, {passive: true}));
    // typsnitten ska vara laddade innan bordet mäts upp
    try { if (document.fonts && document.fonts.ready) await Promise.race([document.fonts.ready, sleep(1500)]); } catch (e) { /* strunt samma */ }
    setLoad(1, 'Välkommen!');
    Menu.show('title');
    $('loading').classList.add('done');
    setTimeout(() => { const l = $('loading'); if (l) l.remove(); }, 700);
    // (länken till ett bord läses innan lobbyn tar bort den ur adressen)
    const linked = /^#[a-z]{4}/i.test(location.hash) || /[?&]bord=/.test(location.search);
    if (typeof Lobby !== 'undefined') Lobby.boot();
    // första gången: lugnt och tydligt eller som vanligt? (inte när man kommer via en länk till ett bord)
    const sv = Net.saved ? Net.saved() : null;
    if (!Store.get('intro', false) && !linked && !Net.savedSolo() && !(sv && (sv.host || sv.room))) setTimeout(() => { if (Menu.screen() === 'title' && !UI.topSheet()) Menu.intro(); }, 500);
  };
  return A;
})();

if (/[?&]debug\b/.test(location.search)) window.CK = {Game: typeof Game !== 'undefined' ? Game : null, Net: typeof Net !== 'undefined' ? Net : null, Lobby: typeof Lobby !== 'undefined' ? Lobby : null, Mqtt: typeof Mqtt !== 'undefined' ? Mqtt : null, Crypt: typeof Crypt !== 'undefined' ? Crypt : null, Rules: typeof Rules !== 'undefined' ? Rules : null, Cards: typeof Cards !== 'undefined' ? Cards : null, AI: typeof AI !== 'undefined' ? AI : null, Table: typeof Table !== 'undefined' ? Table : null, Play: typeof Play !== 'undefined' ? Play : null, Coach: typeof Coach !== 'undefined' ? Coach : null, Menu: typeof Menu !== 'undefined' ? Menu : null, Help: typeof Help !== 'undefined' ? Help : null, UI: typeof UI !== 'undefined' ? UI : null, Sound: typeof Sound !== 'undefined' ? Sound : null, Voice: typeof Voice !== 'undefined' ? Voice : null, Time: typeof Time !== 'undefined' ? Time : null, Settings: typeof Settings !== 'undefined' ? Settings : null, Profile: typeof Profile !== 'undefined' ? Profile : null, Stats: typeof Stats !== 'undefined' ? Stats : null, Store: typeof Store !== 'undefined' ? Store : null, Bus: typeof Bus !== 'undefined' ? Bus : null, Art: typeof Art !== 'undefined' ? Art : null, Main: typeof Main !== 'undefined' ? Main : null};

Main.boot();
})();
</script>
<script>if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js').catch(() => {});</script>
</body>
